<div class="card">
  <h2>Preguntas de repaso</h2>
  <details><summary>1. Cuando A envía a D (otra red), ¿por qué la MAC destino de la primera trama es la de R1 y no la de D?</summary><p>Porque la MAC sólo sirve dentro de la red local. A aplica su máscara, ve que D está en otra red y entrega el paquete a su gateway (R1): necesita la MAC de R1. La IP destino sigue siendo la de D.</p></details>
  <details><summary>2. ¿Qué campos del datagrama cambian al cruzar un router y cuáles no?</summary><p>Cambian: el TTL (−1), el checksum de cabecera (por el TTL) y, en la trama que lo transporta, MAC origen y MAC destino. No cambian: IP origen, IP destino ni el contenido del segmento (salvo NAT, que no se trata aquí).</p></details>
  <details><summary>3. ¿Por qué ARP no puede resolver la MAC de un host de otra red? ¿Cómo se resuelve entonces?</summary><p>La solicitud ARP se difunde a nivel de enlace y los routers no reenvían difusiones. El host resuelve la MAC del <i>gateway</i>, y cada router resuelve la del siguiente salto en su propia red. La excepción es el proxy ARP, donde el router contesta con su propia MAC.</p></details>
  <details><summary>4. ¿Por qué un cliente DHCP envía con IP origen 0.0.0.0 y destino 255.255.255.255? ¿Para qué sirve el relay?</summary><p>Todavía no tiene dirección ni conoce al servidor, así que usa difusión limitada. Como los routers no reenvían difusiones, un relay agent las recibe, completa <b>giaddr</b> y las reenvía como unicast al servidor; éste usa giaddr para elegir el ámbito y contesta al relay, que entrega la respuesta al cliente.</p></details>
  <details><summary>5. ¿Qué limitaciones de RARP resolvió DHCP?</summary><p>RARP necesitaba un servidor por red (no cruza routers), sólo devolvía la IP (sin máscara, gateway ni DNS), usaba una tabla estática manual y trabajaba directamente sobre Ethernet. DHCP usa UDP/IP con relays, entrega la configuración completa y asigna dinámicamente con concesión temporal.</p></details>
  <details><summary>6. ¿Cómo funciona traceroute?</summary><p>Envía sondas con TTL 1, 2, 3… Cada router donde el TTL llega a 0 descarta la sonda y responde ICMP Time Exceeded, con lo que se conoce su IP. Cuando una sonda llega al destino, éste responde (por ejemplo, Echo Reply) y termina.</p></details>
  <details><summary>7. ¿Qué es un ARP gratuito y para qué sirve?</summary><p>Una solicitud ARP donde IP emisor = IP objetivo, difundida sin esperar respuesta. Actualiza cachés ajenas tras un cambio de MAC o un failover, y si alguien contesta revela una IP duplicada.</p></details>
  <details><summary>8. ¿Qué ocurre si un host miente en sus respuestas ARP?</summary><p>ARP no tiene autenticación: cualquiera puede contestar o enviar respuestas no solicitadas, y los demás actualizan su caché (<i>ARP spoofing</i>), lo que permite desviar tráfico (hombre en el medio). Se mitiga con entradas estáticas, inspección dinámica de ARP en los switches, etc.</p></details>
  <details><summary>9. ¿Qué diferencias hay entre BOOTP y DHCP?</summary><p>Comparten formato de mensaje y puertos (UDP 67/68). BOOTP intercambia dos mensajes y asigna de forma estática, según una tabla MAC → IP armada a mano, sin concesión. DHCP agrega asignación dinámica con <i>lease</i>, el intercambio de cuatro mensajes, renovación y muchas más opciones.</p></details>
  <details><summary>10. Si A hace ping a D, ¿por qué el Echo Reply normalmente no genera mensajes ARP?</summary><p>Porque cada solicitud ARP del camino de ida enseñó la MAC del que preguntó al que respondió (A a R1, R1 a R2, R2 a D). Al volver, cada equipo ya tiene en su caché a quién entregar la trama.</p></details>
</div>

  mkQ('icmp', '¿Cómo funciona traceroute?', 'Envía sondas con TTL creciente y registra los Time Exceeded de cada router', ['Consulta por SNMP la tabla de rutas de cada router', 'Usa ARP para listar los routers', 'Envía una sola sonda con TTL = 255'], 'Cuando una sonda llega al destino, éste responde y termina.'),
  mkQ('icmp', '¿Se genera un mensaje ICMP de error en respuesta a otro mensaje ICMP de error?', 'No: se evita para no provocar tormentas de mensajes', ['Sí, siempre', 'Sólo si el TTL es 0', 'Sólo si es un Echo Request'], 'Esta regla evita bucles de errores.'),
  mkQ('icmp', '¿Qué tipos ICMP corresponden a Echo Request y Echo Reply?', 'Request = 8, Reply = 0', ['Request = 0, Reply = 8', 'Request = 3, Reply = 11', 'Request = 5, Reply = 0'], 'Son la base de la herramienta ping.'),
  mkQ('icmp', '¿Qué indica Destination Unreachable con código 1?', 'Host inalcanzable (p. ej., el router no pudo resolver su MAC con ARP)', ['Red inalcanzable', 'Puerto inalcanzable', 'Fragmentación necesaria'], 'Código 0 = red, 1 = host, 3 = puerto, 4 = fragmentación necesaria con DF.'),
  mkQ('icmp', '¿Qué parte del datagrama original incluye un ICMP de error?', 'Su cabecera IP y los primeros 8 bytes de datos', ['Sólo la IP origen', 'El datagrama completo, siempre', 'Nada'], 'Así el origen puede identificar la conexión afectada.'),

  mkQ('route', 'Al cruzar un router, ¿qué NO cambia en el datagrama ni en su trama?', 'La IP origen y la IP destino', ['La MAC origen', 'La MAC destino', 'El TTL'], 'Las IP son de extremo a extremo; las MAC se reescriben en cada red.'),
  mkQ('route', '¿Qué hace un router con el TTL?', 'Lo decrementa en 1 y descarta el datagrama si llega a 0', ['Lo reinicia a 64', 'Lo incrementa', 'No lo toca'], 'Evita que los datagramas circulen eternamente en bucles.'),
  mkQ('route', '¿Cómo decide un host si el destino está en su misma red?', 'Aplica su máscara a su IP y a la del destino y compara los resultados', ['Hace un ping previo', 'Consulta al DNS', 'Compara las direcciones MAC'], 'Si las redes coinciden, el destino es local.'),
  mkQ('route', 'El último router del camino (destino en una red conectada directamente) hace ARP por…', 'La IP del destino final', ['La IP del router anterior', 'La IP del gateway del destino', '255.255.255.255'], 'Ya no hay otro salto: la trama se entrega directamente al host.'),
  mkQ('route', 'Si varias rutas de la tabla coinciden con el destino, el router usa…', 'La más específica (prefijo más largo)', ['La primera de la tabla', 'La de menor número de interfaz', 'La de prefijo más corto'], 'Es la regla de coincidencia de prefijo más largo.')
];

/* ----- estado e interfaz ----- */
const E = { phase:'setup', topics:{ route:true, arp:true, rarp:true, bootp:true, dhcp:true, icmp:true }, n:10, mode:'estudio', qs:[], i:0, ans:[], warn:'', refOpen:false };
const REF = (() => {
  const rows = []; IDS.forEach(id => BASE.nodes[id].ifs.forEach(f => rows.push(`<tr><td>${id}${BASE.nodes[id].kind === 'router' ? '.' + f.n : ''}</td><td class="m">${f.ip}/${f.p}</td><td class="m">${f.mac}</td></tr>`)));
  return `<p style="margin-top:0">LAN 1 <code>192.168.1.0/24</code>: A, B, S y R1.e0 · LAN 2 <code>10.0.0.0/24</code>: R1.e1 y R2.e0 · LAN 3 <code>172.16.0.0/24</code>: R2.e1, C y D. Gateway de A, B y S: R1.e0; de C y D: R2.e1. R1 llega a la LAN 3 vía 10.0.0.2 y R2 a la LAN 1 vía 10.0.0.1. Ningún router tiene ruta por defecto.</p><table class="mini"><tr><th>Interfaz</th><th>IP</th><th>MAC</th></tr>${rows.join('')}</table>`;
})();
function buildExam(topics, n) {
  const stat = shuffle(BANK().filter(q => topics.includes(q.t)), rnd(1e9)), dyn = DYN.filter(d => topics.includes(d.t)), qs = [], seen = new Set();
  const want = dyn.length ? Math.min(Math.ceil(n / 3), n) : 0;
  const addDyn = lim => { for (let i = 0; i < 60 && qs.length < lim; i++) { const q = pick(dyn).g(); if (!seen.has(q.q)) { seen.add(q.q); qs.push(q); } } };
  addDyn(want);
  stat.slice(0, n - qs.length).forEach(q => qs.push(q));
  if (dyn.length) addDyn(n);
  return shuffle(qs, rnd(1e9)).slice(0, n);
}
function startExam(qs) { E.qs = qs; E.i = 0; E.ans = qs.map(() => null); E.phase = 'run'; E.warn = ''; renderExam(); }
function examScore() {
  let ok = 0; const by = {};
  E.qs.forEach((q, i) => { const r = E.ans[i] === q.a; by[q.t] = by[q.t] || [0, 0]; by[q.t][1]++; if (r) { ok++; by[q.t][0]++; } });
  return { ok, n:E.qs.length, by };
}
function renderExam() {
  const el = $('#view-exam');
  if (E.phase === 'setup') {
    el.innerHTML = `<div class="card"><h2>Examen</h2><p class="muted" style="max-width:68ch;margin:0">Preguntas de opción múltiple sobre los temas del simulador. Algunas se generan en el momento con la propia red de práctica (por ejemplo, calcular la MAC destino de un salto), así que cada examen es distinto.</p>
      <h3>Temas</h3><div class="chips" style="margin-top:0">${Object.entries(TOPICS).map(([k, v]) => `<label class="chip tchk"><input type="checkbox" data-topic="${k}" ${E.topics[k] ? 'checked' : ''}> ${v}</label>`).join('')}</div>
      <h3>Cantidad de preguntas</h3><select id="x-n">${[5, 10, 15, 20].map(n => `<option value="${n}" ${E.n === n ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <h3>Modo</h3>
      <label class="radio"><input type="radio" name="xm" value="estudio" ${E.mode === 'estudio' ? 'checked' : ''}> <span><b>Estudio</b> · se corrige cada pregunta apenas respondés y ves la explicación</span></label>
      <label class="radio"><input type="radio" name="xm" value="examen" ${E.mode === 'examen' ? 'checked' : ''}> <span><b>Examen</b> · podés ir y volver; la corrección aparece al final</span></label>
      ${E.warn ? `<p style="color:var(--danger);margin:14px 0 0">${E.warn}</p>` : ''}
      <div style="margin-top:22px"><button class="btn" data-x="start">Comenzar</button></div></div>`;
    return;
  }
  if (E.phase === 'run') {
    const q = E.qs[E.i], a = E.ans[E.i], study = E.mode === 'estudio', locked = study && a != null, n = E.qs.length, last = E.i === n - 1;
    const answered = E.ans.filter(x => x != null).length;
    el.innerHTML = `<div class="card">
      <div class="xhead"><span class="tag ${q.t === 'rarp' ? 'rarp' : q.t === 'icmp' ? 'icmp' : q.t === 'arp' ? 'arp' : q.t === 'route' ? 'ip' : 'dhcp'}">${TOPICS[q.t]}</span><span class="muted small">Pregunta ${E.i + 1} de ${n} · ${study ? 'modo estudio' : `respondidas ${answered}/${n}`}</span></div>
      <div class="prog"><i style="width:${(E.i + (locked || (!study && a != null) ? 1 : 0)) / n * 100}%"></i></div>
      <details class="quiet" id="x-ref" ${E.refOpen ? 'open' : ''}><summary>Red y direcciones de referencia</summary><div class="inner">${REF}</div></details>
      <div class="xq">${q.q}</div>
      <div class="xopts">${q.opts.map((o, k) => `<button class="xopt ${locked ? (k === q.a ? 'right' : k === a ? 'wrong' : '') : (k === a ? 'sel' : '')}" data-o="${k}" ${locked ? 'disabled' : ''}><span class="xl">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      ${locked ? `<div class="fb ${a === q.a ? 'ok' : 'bad'}"><b>${a === q.a ? '✔ Correcto.' : '✘ Incorrecto.'}</b> ${q.why}</div>` : ''}
      ${E.warn ? `<p style="color:var(--danger);margin:12px 0 0">${E.warn}</p>` : ''}
      <div class="xnav"><button class="btn secondary" data-x="prev" ${E.i === 0 ? 'disabled' : ''}>← Anterior</button>
        ${last ? `<button class="btn" data-x="finish">Finalizar y corregir</button>` : `<button class="btn" data-x="next">Siguiente →</button>`}</div>
    </div>`;
    return;
  }
  const sc = examScore(), pct = Math.round(sc.ok / sc.n * 100), nota = (sc.ok / sc.n * 10).toFixed(1).replace('.', ','), blank = E.ans.filter(x => x == null).length, wrongN = sc.n - sc.ok;
  el.innerHTML = `<div class="card"><h2>Resultado</h2>
    <div class="big"><span>${nota}</span><small>/ 10</small></div>
    <p class="muted" style="margin:0">${sc.ok} de ${sc.n} correctas (${pct} %)${blank ? ` · ${blank} sin responder (cuentan como incorrectas)` : ''}</p>
    <h3>Por tema</h3>
    ${Object.entries(sc.by).map(([t, [o, tot]]) => `<div class="trow"><span>${TOPICS[t]}</span><div class="prog"><i style="width:${o / tot * 100}%"></i></div><span class="mono">${o}/${tot}</span></div>`).join('')}
    <div class="xnav" style="margin-top:22px"><button class="btn secondary" data-x="again">Nuevo examen</button><button class="btn" data-x="redo" ${wrongN ? '' : 'disabled'}>Repasar las ${wrongN} erradas</button></div></div>
    <div class="card" style="margin-top:16px"><h2>Revisión</h2>${E.qs.map((q, i) => { const a = E.ans[i], ok = a === q.a;
      return `<details class="rev ${ok ? 'ok' : 'bad'}"><summary><span class="mk">${ok ? '✔' : '✘'}</span><span>${i + 1}. ${q.q.replace(/<span class="muted">.*?<\/span>/, '')}</span></summary>
        <p style="margin:8px 0 0"><span class="muted">Tu respuesta:</span> ${a == null ? '<i>sin responder</i>' : esc(q.opts[a])}</p><p style="margin:2px 0"><span class="muted">Correcta:</span> <b>${esc(q.opts[q.a])}</b></p><p style="margin:6px 0 0">${q.why}</p></details>`; }).join('')}</div>`;
}
$('#view-exam').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.topic) E.topics[t.dataset.topic] = t.checked; else if (t.id === 'x-n') E.n = +t.value; else if (t.name === 'xm') E.mode = t.value;
});
$('#view-exam').addEventListener('toggle', e => { if (e.target.id === 'x-ref') E.refOpen = e.target.open; }, true);
$('#view-exam').addEventListener('click', e => {
  const o = e.target.closest('[data-o]');
  if (o) { if (E.mode === 'estudio' && E.ans[E.i] != null) return; E.ans[E.i] = +o.dataset.o; E.warn = ''; renderExam(); return; }
  const b = e.target.closest('[data-x]'); if (!b) return;
  const act = b.dataset.x;
  if (act === 'start') {
    const sel = Object.keys(E.topics).filter(k => E.topics[k]);
    if (!sel.length) { E.warn = 'Elegí al menos un tema.'; renderExam(); return; }
    startExam(buildExam(sel, E.n));
  } else if (act === 'prev') { E.i = Math.max(0, E.i - 1); E.warn = ''; renderExam(); }
  else if (act === 'next') { E.i = Math.min(E.qs.length - 1, E.i + 1); E.warn = ''; renderExam(); }
  else if (act === 'finish') { E.phase = 'result'; renderExam(); window.scrollTo(0, 0); }
  else if (act === 'again') { E.phase = 'setup'; E.warn = ''; renderExam(); }
  else if (act === 'redo') { const w = E.qs.filter((q, i) => E.ans[i] !== q.a); E.mode = 'estudio'; startExam(w); }
});

/* ===== arranque ===== */
buildTopo();
selectTab('route');
</script>
</body>
