<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de protocolos complementarios a IP: ARP, RARP, BOOTP, DHCP e ICMP</title>
<style>
  :root {
    --bg:#fafafb; --surface:#fff; --text:#1f2430; --muted:#868d9c; --line:#ebedf2; --line-2:#dfe2ea;
    --accent:#3b5bdb; --accent-soft:#eef1fe; --ok:#16866f; --warn:#a56a00; --danger:#c0392b;
    --k-arp:#7a5ad8; --k-rarp:#c040b0; --k-ip:#3b5bdb; --k-icmp:#d98200; --k-icmperr:#c0392b; --k-dhcp:#16866f; --k-think:#868d9c;
    --kc:#3b5bdb; --radius:14px;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  code { font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:.88em; background:#f1f3f8; color:#2c3a8c; padding:1px 6px; border-radius:5px; }
  .muted { color:var(--muted); } .small { font-size:12px; }
  .top { padding:34px 0 6px; }
  .wrap, .container { max-width:1040px; margin:0 auto; padding:0 24px; }
  .top h1 { margin:0; font-size:clamp(22px,3vw,28px); font-weight:650; letter-spacing:-.03em; }
  .top p { margin:4px 0 0; color:var(--muted); }
  .container { padding-bottom:60px; }
  .tabs { display:flex; gap:22px; margin:22px 0 26px; border-bottom:1px solid var(--line); overflow-x:auto; overflow-y:hidden; white-space:nowrap; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { border:0; background:none; padding:9px 0 11px; color:var(--muted); font-weight:550; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--text); border-bottom-color:var(--accent); }
  h2 { font-size:20px; font-weight:650; margin:0 0 6px; letter-spacing:-.02em; }
  h3 { font-size:12px; margin:20px 0 8px; color:var(--muted); font-weight:650; text-transform:uppercase; letter-spacing:.06em; }
  .intro p { margin:0; max-width:70ch; font-size:14.5px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; min-width:0; }
  .block { margin-top:18px; }
  /* formulario */
  .form { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; margin-top:18px; }
  .field { display:flex; flex-direction:column; gap:5px; min-width:150px; }
  .field.check { flex-direction:row; align-items:center; gap:8px; min-width:0; padding-bottom:9px; font-size:13px; color:var(--muted); font-weight:500; }
  label { color:var(--muted); font-size:12px; font-weight:600; }
  input[type=text], input[type=number], select { border:1px solid var(--line-2); border-radius:9px; padding:8px 11px; background:#fff; min-width:0; }
  input[type=checkbox] { accent-color:var(--accent); }
  input:focus, select:focus, button:focus-visible { outline:3px solid rgba(59,91,219,.15); border-color:var(--accent); }
  .btn { border:1px solid transparent; border-radius:9px; padding:8px 16px; color:#fff; background:var(--accent); font-weight:600; transition:.15s; }
  .btn:hover { background:#2f49b8; }
  .btn.secondary, .btn.ghost { color:var(--text); background:#fff; border-color:var(--line-2); padding:8px 12px; }
  .btn.secondary:hover, .btn.ghost:hover { background:#f4f5f9; }
  .btn:disabled { opacity:.35; cursor:not-allowed; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; align-items:center; }
  .chip { border:1px solid var(--line-2); background:#fff; color:#4a5263; border-radius:999px; padding:3px 11px; font-size:12px; font-weight:550; }
  .chip:hover { background:var(--accent-soft); border-color:#c9d3fb; color:var(--accent); }
  /* secciones plegables */
  details.quiet { border-top:1px solid var(--line); padding:0; margin-top:0; background:none; border-radius:0; }
  details.quiet:last-of-type { border-bottom:1px solid var(--line); }
  details.quiet > summary { list-style:none; cursor:pointer; padding:14px 2px; color:#4a5263; font-weight:600; font-size:14px; display:flex; align-items:center; gap:9px; }
  details.quiet > summary::-webkit-details-marker { display:none; }
  details.quiet > summary::before { content:"›"; display:inline-block; transition:transform .15s; color:var(--muted); font-size:18px; line-height:1; }
  details.quiet[open] > summary::before { transform:rotate(90deg); }
  details.quiet > .inner { padding:0 2px 18px; }
  details.quiet p, details.quiet ul { margin:8px 0; } details.quiet ul { padding-left:20px; }
  details.more { margin-top:8px; }
  details.more > summary { cursor:pointer; color:var(--accent); font-size:13px; font-weight:600; list-style:none; }
  details.more > summary::-webkit-details-marker { display:none; }
  details.more > summary::after { content:" ▾"; font-size:11px; }
  details.more[open] > summary::after { content:" ▴"; }
  details.hdr { margin-top:14px; }
  details.hdr > summary { cursor:pointer; color:var(--muted); font-size:13px; font-weight:600; }
  .notice { padding:11px 14px; border-radius:10px; background:var(--accent-soft); color:#2c3a8c; font-size:13.5px; }
  .notice.warn { background:#fff8e8; color:#7a5200; }
  /* topología */
  .topo-wrap { border-radius:10px; overflow:hidden; }
  #topo { display:block; width:100%; height:auto; user-select:none; }
  .bus { stroke:#e2e5ec; stroke-width:7; stroke-linecap:round; transition:stroke .2s; }
  .bus.hot { stroke:var(--kc); }
  .stem { stroke:#e2e5ec; stroke-width:2; }
  .lan-label { font-size:11.5px; font-weight:600; fill:#9aa1b0; }
  .if-label { font-size:10.5px; fill:#8a91a0; font-family:ui-monospace,Consolas,monospace; }
  .node .box { fill:#fff; stroke:#cfd4df; stroke-width:1.5; transition:.2s; }
  .node .rt { fill:#fff; stroke:#3b5bdb; stroke-width:2; transition:.2s; }
  .node .nm { font-weight:700; font-size:14px; text-anchor:middle; fill:#1f2430; }
  .node .ipt { font-size:11px; text-anchor:middle; fill:#8a91a0; font-family:ui-monospace,Consolas,monospace; }
  .node.from .box, .node.from .rt { stroke:var(--kc); stroke-width:3; }
  .node.ok .box, .node.ok .rt { stroke:var(--ok); fill:#f1faf7; stroke-width:3; }
  .node.upd .box, .node.upd .rt, .node.think .box, .node.think .rt { stroke:#d98200; fill:#fffaf0; stroke-width:3; }
  .node.no { opacity:.45; }
  .badge { font-size:11.5px; font-weight:650; text-anchor:middle; paint-order:stroke; stroke:#fff; stroke-width:4px; stroke-linejoin:round; }
  .badge.ok { fill:var(--ok); } .badge.no { fill:var(--muted); } .badge.think { fill:var(--warn); } .badge.from { fill:var(--kc); }
  .token rect { fill:var(--kc); } .token text { fill:#fff; font-size:10.5px; font-weight:700; text-anchor:middle; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px; }
  .controls .btn { min-width:38px; }
  .controls input[type=range] { flex:1; min-width:140px; accent-color:var(--accent); }
  .controls select { padding:6px 8px; font-size:13px; }
  .stepno { font-weight:600; color:var(--muted); font-size:13px; min-width:88px; text-align:center; }
  .predrow { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:12px; font-size:13px; color:var(--muted); }
  .predrow label { display:flex; gap:7px; align-items:center; font-weight:500; font-size:13px; }
  .score { font-weight:600; color:var(--accent); }
  /* detalle del paso */
  .tag { display:inline-flex; align-items:center; color:var(--k-think); font-size:12px; font-weight:650; letter-spacing:.02em; }
  .tag::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; margin-right:6px; }
  .tag.arp { color:var(--k-arp); } .tag.rarp { color:var(--k-rarp); } .tag.ip { color:var(--k-ip); }
  .tag.icmp { color:var(--k-icmp); } .tag.icmperr { color:var(--k-icmperr); } .tag.dhcp { color:var(--k-dhcp); }
  .step-title { font-size:19px; font-weight:650; margin:8px 0 10px; letter-spacing:-.02em; text-transform:none; color:var(--text); line-height:1.35; }
  .step-body { max-width:72ch; }
  .step-body p { margin:8px 0; }
  .calc { background:#f7f8fb; border-radius:9px; padding:8px 12px; }
  .learn { margin:12px 0 0; padding:9px 13px; border-radius:9px; background:#f1faf7; color:#14614f; font-size:13px; }
  .layer { border:1px solid var(--line); border-radius:10px; margin-top:9px; overflow:hidden; }
  .layer > .lh { background:#f7f8fb; color:#4a5263; font-weight:650; font-size:12px; padding:6px 12px; }
  .fields { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
  .fld { padding:7px 12px; border-top:1px solid #f0f1f5; min-width:0; overflow-wrap:anywhere; }
  .fld .l { display:block; font-size:10.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .fld .v { font-family:ui-monospace,Consolas,monospace; font-size:12.5px; font-weight:550; }
  .fld .v small { font-family:inherit; font-weight:650; color:var(--accent); background:var(--accent-soft); border-radius:5px; padding:0 5px; margin-left:4px; }
  .fld.changed { background:#fff8e8; } .fld.changed .l::after { content:" · cambió"; color:#b45309; }
  .mcq { border:1px dashed #c9d3fb; border-radius:12px; padding:13px 15px; background:#fafbff; margin:12px 0; }
  .mcq .opts { display:grid; gap:7px; margin-top:9px; }
  .mcq .opt { text-align:left; border:1px solid var(--line-2); background:#fff; border-radius:9px; padding:8px 12px; font-family:ui-monospace,Consolas,monospace; font-size:13px; font-weight:550; }
  .mcq .opt:hover:not(:disabled) { background:var(--accent-soft); }
  .mcq .opt.right { background:#e8f7f1; border-color:var(--ok); } .mcq .opt.wrong { background:#fdecea; border-color:var(--danger); }
  /* lista de pasos */
  .steplist { position:relative; max-height:320px; overflow:auto; display:flex; flex-direction:column; gap:2px; }
  .si { display:flex; gap:10px; align-items:center; text-align:left; border:0; background:none; border-radius:8px; padding:6px 9px; font-size:13px; }
  .si:hover { background:#f4f5f9; } .si.active { background:var(--accent-soft); font-weight:600; }
  .si.future { opacity:.5; } .si .n { color:var(--muted); font-weight:600; min-width:20px; }
  .si .tag { min-width:80px; }
  /* dispositivos */
  .devs { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
  .dev { border:1px solid var(--line); border-radius:11px; padding:10px 12px; background:#fff; font-size:12.5px; }
  .dev.changed { border-color:#f0c36d; background:#fffdf7; }
  .dev .dn { font-weight:700; font-size:14px; } .dev .dr { color:var(--muted); font-size:11.5px; font-weight:500; }
  .dev .ifline { margin-top:5px; }
  .mono { font-family:ui-monospace,Consolas,monospace; font-size:11.5px; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th, td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; }
  th { color:var(--muted); font-weight:600; font-size:11.5px; }
  .tw { overflow:auto; }
  td.m { font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  tr.cur td { background:var(--accent-soft); font-weight:600; } tr.fut td { opacity:.4; }
  tr.chosen td { background:#f1faf7; font-weight:600; }
  table.mini { margin:6px 0; } table.mini td, table.mini th { padding:3px 7px; }
  .arpt { margin-top:7px; } .arpt td.new { background:#e8f7f1; font-weight:650; }
  .enc { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .encrow { display:flex; align-items:stretch; font-size:12px; font-weight:600; flex-wrap:wrap; gap:2px; }
  .encrow span { padding:8px 12px; color:#fff; text-align:center; border-radius:5px; }
  .encrow .eth { background:#6b7385; } .encrow .ip { background:#3b5bdb; } .encrow .udp { background:#16866f; }
  .encrow .dhcp { background:#3aa896; } .encrow .icmp { background:#d98200; } .encrow .arp { background:#7a5ad8; } .encrow .rarp { background:#c040b0; }
  .encrow .lbl { background:transparent; color:var(--muted); min-width:150px; text-align:left; align-self:center; }
  #view-sum .card { margin-bottom:16px; }
  #view-sum details { border:1px solid var(--line); border-radius:10px; padding:9px 14px; margin-top:8px; }
  #view-sum details summary { cursor:pointer; font-weight:600; }
  /* examen */
  .tchk { display:inline-flex; align-items:center; gap:7px; cursor:pointer; padding:5px 12px; font-size:13px; }
  .tchk:has(input:checked) { background:var(--accent-soft); border-color:#c9d3fb; color:var(--accent); }
  label.radio { display:flex; gap:10px; align-items:flex-start; padding:7px 0; color:var(--text); font-size:14px; font-weight:400; }
  label.radio input { margin-top:5px; accent-color:var(--accent); }
  .xhead { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .prog { height:4px; border-radius:4px; background:var(--line); overflow:hidden; margin:10px 0 6px; flex:1; }
  .prog i { display:block; height:100%; background:var(--accent); transition:width .25s; }
  .xq { font-size:17px; line-height:1.55; margin:18px 0 16px; max-width:72ch; }
  .xopts { display:grid; gap:8px; }
  .xopt { display:flex; gap:12px; align-items:flex-start; text-align:left; border:1px solid var(--line-2); background:#fff; border-radius:11px; padding:11px 14px; font-size:14.5px; transition:.12s; }
  .xopt:hover:not(:disabled) { background:#f6f7fb; }
  .xopt .xl { flex:none; width:22px; height:22px; border-radius:50%; border:1px solid var(--line-2); display:grid; place-items:center; font-size:11.5px; font-weight:650; color:var(--muted); }
  .xopt.sel { border-color:var(--accent); background:var(--accent-soft); } .xopt.sel .xl { background:var(--accent); border-color:var(--accent); color:#fff; }
  .xopt.right { border-color:var(--ok); background:#f1faf7; } .xopt.right .xl { background:var(--ok); border-color:var(--ok); color:#fff; }
  .xopt.wrong { border-color:var(--danger); background:#fdf3f2; } .xopt.wrong .xl { background:var(--danger); border-color:var(--danger); color:#fff; }
  .xopt:disabled { cursor:default; }
  .fb { margin-top:14px; padding:12px 15px; border-radius:11px; font-size:14px; }
  .fb.ok { background:#f1faf7; color:#14614f; } .fb.bad { background:#fdf3f2; color:#8f2a20; }
  .xnav { display:flex; justify-content:space-between; gap:10px; margin-top:20px; }
  .big { font-size:56px; font-weight:650; letter-spacing:-.04em; line-height:1.1; margin:8px 0 4px; }
  .big small { font-size:18px; color:var(--muted); font-weight:500; margin-left:6px; letter-spacing:0; }
  .trow { display:grid; grid-template-columns:200px 1fr 44px; gap:12px; align-items:center; font-size:13.5px; }
  .trow .prog { margin:6px 0; }
  @media (max-width:600px) { .trow { grid-template-columns:110px 1fr 40px; } }
  details.rev { border:1px solid var(--line); border-radius:10px; padding:9px 14px; margin-top:8px; }
  details.rev > summary { cursor:pointer; display:flex; gap:10px; font-weight:550; font-size:14px; }
  details.rev .mk { font-weight:700; } details.rev.ok .mk { color:var(--ok); } details.rev.bad .mk { color:var(--danger); }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Protocolos complementarios a IP</h1>
    <p>ARP, RARP, BOOTP, DHCP e ICMP: cómo un paquete encuentra su camino, trama a trama.</p>
  </div>
</header>
<main class="container">
  <nav class="tabs" id="tabs" aria-label="Escenarios"></nav>

  <section id="view-sim">
    <div class="intro"><h2 id="sc-title"></h2><p id="sc-intro" class="muted"></p></div>
    <div class="form" id="form"></div>
    <div class="chips" id="presets"></div>

    <div class="card block">
      <div class="topo-wrap"><svg id="topo" viewBox="0 36 1000 270" role="img" aria-label="Topología de la red"></svg></div>
      <div class="controls">
        <button class="btn secondary" id="b-first" title="Primer paso">⏮</button>
        <button class="btn secondary" id="b-prev" title="Anterior (←)">◀</button>
        <button class="btn" id="b-play">▶ Reproducir</button>
        <button class="btn secondary" id="b-next" title="Siguiente (→)">▶</button>
        <button class="btn secondary" id="b-last" title="Último paso">⏭</button>
        <span class="stepno" id="stepno"></span>
        <input type="range" id="slider" min="0" max="0" value="0" aria-label="Paso">
        <select id="speed" aria-label="Velocidad"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      </div>
      <div class="predrow">
        <label><input type="checkbox" id="pred"> Modo predicción: adiviná la MAC destino antes de verla</label>
        <span class="score" id="score"></span>
      </div>
    </div>

    <div class="card block"><div id="detail"></div></div>

    <div class="block">
      <details class="quiet" id="theory"><summary>Teoría de este escenario</summary><div class="inner" id="theory-body"></div></details>
      <details class="quiet"><summary>Secuencia completa</summary><div class="inner"><div class="steplist" id="steplist"></div></div></details>
      <details class="quiet"><summary>Tramas que transportaron el datagrama</summary><div class="inner tw" id="hops"></div></details>
      <details class="quiet"><summary>Estado de los dispositivos (direcciones y cachés ARP)</summary><div class="inner"><div class="devs" id="devs"></div></div></details>
      <details class="quiet"><summary>Opciones de caché ARP</summary><div class="inner">
        <div class="chips" style="margin-top:0">
          <label style="display:flex;gap:7px;align-items:center;font-weight:500;font-size:13px"><input type="checkbox" id="clr" checked> Vaciar las cachés antes de cada simulación</label>
          <button class="btn ghost" id="btn-flush">Vaciar ahora</button>
          <span class="muted small" id="cache-count"></span>
        </div>
      </div></details>
    </div>
  </section>

  <section id="view-sum" hidden></section>
  <section id="view-exam" hidden></section>
</main>
<script>
'use strict';
/* =====================================================================
   1. MODELO DE RED
   ===================================================================== */
const BCAST = 'FF:FF:FF:FF:FF:FF', ZERO = '00:00:00:00:00:00', BUS_Y = 230;
const LANS = {
  L1:{ name:'LAN 1', net:'192.168.1.0/24', x1:40,  x2:324 },
  L2:{ name:'LAN 2', net:'10.0.0.0/24',    x1:376, x2:624 },
  L3:{ name:'LAN 3', net:'172.16.0.0/24',  x1:676, x2:970 }
};
const BASE = { nodes:{
  A:{ id:'A', kind:'host', role:'Host', x:80,  y:80, gw:'192.168.1.1', arp:{}, ifs:[{n:'eth0', ip:'192.168.1.10', p:24, mac:'02:00:00:00:00:0A', lan:'L1'}] },
  B:{ id:'B', kind:'host', role:'Host', x:190, y:80, gw:'192.168.1.1', arp:{}, ifs:[{n:'eth0', ip:'192.168.1.20', p:24, mac:'02:00:00:00:00:0B', lan:'L1'}] },
  S:{ id:'S', kind:'host', role:'Servidor DHCP / RARP', x:290, y:80, gw:'192.168.1.1', arp:{}, ifs:[{n:'eth0', ip:'192.168.1.5', p:24, mac:'02:00:00:00:00:05', lan:'L1'}] },
  R1:{ id:'R1', kind:'router', role:'Router', x:350, y:230, proxyArp:false, arp:{},
       ifs:[{n:'e0', ip:'192.168.1.1', p:24, mac:'02:00:00:00:01:00', lan:'L1', side:'l'}, {n:'e1', ip:'10.0.0.1', p:24, mac:'02:00:00:00:01:01', lan:'L2', side:'r'}],
       routes:[{net:'192.168.1.0',p:24,via:null,if:0},{net:'10.0.0.0',p:24,via:null,if:1},{net:'172.16.0.0',p:24,via:'10.0.0.2',if:1}] },
  R2:{ id:'R2', kind:'router', role:'Router', x:650, y:230, proxyArp:false, arp:{},
       ifs:[{n:'e0', ip:'10.0.0.2', p:24, mac:'02:00:00:00:02:00', lan:'L2', side:'l'}, {n:'e1', ip:'172.16.0.1', p:24, mac:'02:00:00:00:02:01', lan:'L3', side:'r'}],
       routes:[{net:'172.16.0.0',p:24,via:null,if:1},{net:'10.0.0.0',p:24,via:null,if:0},{net:'192.168.1.0',p:24,via:'10.0.0.1',if:0}] },
  C:{ id:'C', kind:'host', role:'Host', x:790, y:80, gw:'172.16.0.1', arp:{}, ifs:[{n:'eth0', ip:'172.16.0.10', p:24, mac:'02:00:00:00:00:0C', lan:'L3'}] },
  D:{ id:'D', kind:'host', role:'Host (servidor DHCP remoto)', x:910, y:80, gw:'172.16.0.1', arp:{}, ifs:[{n:'eth0', ip:'172.16.0.20', p:24, mac:'02:00:00:00:00:0D', lan:'L3'}] }
}};
const IDS = Object.keys(BASE.nodes);
const clone = o => JSON.parse(JSON.stringify(o));
let PW = clone(BASE);                       // mundo persistente (cachés ARP entre simulaciones)

/* utilidades IP */
const ip2n = ip => ip.split('.').reduce((a, b) => a * 256 + (+b), 0);
const n2ip = n => [Math.floor(n / 16777216) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join('.');
const maskN = p => p === 0 ? 0 : (0xFFFFFFFF << (32 - p)) >>> 0;
const netOf = (ip, p) => n2ip((ip2n(ip) & maskN(p)) >>> 0);
const sameNet = (a, b, p) => netOf(a, p) === netOf(b, p);
const validIp = s => /^(\d{1,3})(\.\d{1,3}){3}$/.test(s) && s.split('.').every(x => +x <= 255);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isMac = s => /^[0-9A-F]{2}(:[0-9A-F]{2}){5}$/.test(s);

function snapshot(W) {
  const o = {};
  IDS.forEach(id => { const n = W.nodes[id];
    o[id] = { gw:n.gw || null, ifs:n.ifs.map(f => ({ ip:f.ip, p:f.p, mac:f.mac })), arp:{ ...n.arp } }; });
  return o;
}
function lanMembers(W, lan) {
  const r = [];
  IDS.forEach(id => W.nodes[id].ifs.forEach((f, i) => { if (f.lan === lan) r.push({ id, i }); }));
  return r;
}
function findMac(W, mac) { for (const id of IDS) { const i = W.nodes[id].ifs.findIndex(f => f.mac === mac); if (i >= 0) return { id, i }; } return null; }
function findIp(W, ip) { for (const id of IDS) { const i = W.nodes[id].ifs.findIndex(f => f.ip === ip); if (i >= 0) return { id, i, mac:W.nodes[id].ifs[i].mac }; } return null; }
function lbl(W, id, i = 0) { const n = W.nodes[id]; return n.kind === 'router' ? `${id}.${n.ifs[i].n}` : id; }
function lookup(r, dst) {
  let best = null;
  r.routes.forEach((rt, k) => { if (sameNet(dst, rt.net, rt.p) && (!best || rt.p > best.p)) best = { ...rt, k }; });
  return best;
}
function mkSim(W) { return { W, steps:[], init:snapshot(W) }; }
function push(sim, s) { s.snap = snapshot(sim.W); sim.steps.push(s); return s; }
function think(sim, at, title, html, kind) { return push(sim, { type:'think', at, kind:kind || 'think', title, html }); }

/* constructores de capas (para mostrar las cabeceras) */
const PROTO = { 1:'1 (ICMP)', 6:'6 (TCP)', 17:'17 (UDP)' };
const ETYPE = { ip:'0x0800 (IPv4)', arp:'0x0806 (ARP)', rarp:'0x8035 (RARP)' };
const eth = (dst, src, type, hl = {}) => ({ name:'Trama Ethernet II', fields:[['MAC destino', dst, hl.dst], ['MAC origen', src, hl.src], ['EtherType', type]], dstIdx:0 });
const ipL = (p, hl = {}) => ({ name:'Cabecera IPv4', fields:[['Versión / IHL', '4 / 5'], ['TTL', p.ttl, hl.ttl], ['Protocolo', PROTO[p.proto] || p.proto], ['IP origen', p.src], ['IP destino', p.dst]] });
const udpL = (s, d) => ({ name:'Segmento UDP', fields:[['Puerto origen', s], ['Puerto destino', d]] });
const arpL = (o) => ({ name:o.name || 'Mensaje ARP', fields:[['Tipo de hardware', '1 (Ethernet)'], ['Tipo de protocolo', '0x0800 (IPv4)'], ['HLEN / PLEN', '6 / 4'], ['Operación', o.oper], ['SHA (MAC emisor)', o.sha], ['SPA (IP emisor)', o.spa], ['THA (MAC objetivo)', o.tha], ['TPA (IP objetivo)', o.tpa]] });
const ICMP_T = { 0:'Echo Reply', 8:'Echo Request', 3:'Destination Unreachable', 11:'Time Exceeded' };
const ICMP_C = { '3/0':'Network unreachable', '3/1':'Host unreachable', '11/0':'TTL exceeded in transit', '0/0':'—', '8/0':'—' };
const icmpL = (t, c, extra = []) => ({ name:'Mensaje ICMP', fields:[['Tipo', `${t} (${ICMP_T[t]})`], ['Código', `${c} (${ICMP_C[t + '/' + c]})`], ['Checksum', 'calculado'], ...extra] });
const dhcpL = (o) => ({ name:'Mensaje DHCP (formato BOOTP)', fields:[['op', o.op], ['Tipo (opción 53)', o.msg], ['xid', o.xid], ['ciaddr', o.ciaddr || '0.0.0.0'], ['yiaddr', o.yiaddr || '0.0.0.0'], ['giaddr', o.giaddr || '0.0.0.0'], ['chaddr', o.chaddr], ['Otras opciones', o.opts || '—']] });

/* opciones de opción múltiple (modo predicción) */
function rng(seed) { let a = seed * 2654435761 >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, seed) { const r = rng(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mkMcq(W, correct, finalIp, seed) {
  const opts = [correct];
  if (!opts.includes(BCAST)) opts.push(BCAST);
  const fo = finalIp && findIp(W, finalIp);
  if (fo && !opts.includes(fo.mac)) opts.push(fo.mac);
  const all = []; IDS.forEach(id => W.nodes[id].ifs.forEach(f => all.push(f.mac)));
  shuffle(all, seed + 7).forEach(m => { if (opts.length < 4 && !opts.includes(m)) opts.push(m); });
  return { correct, options:shuffle(opts, seed + 1) };
}

/* =====================================================================
   2. MOTOR: ARP + ENVÍO IP SALTO A SALTO
   ===================================================================== */
function routeTableHtml(r, chosenK) {
  return `<table class="mini"><tr><th>Red destino</th><th>Siguiente salto</th><th>Interfaz</th></tr>` +
    r.routes.map((rt, k) => `<tr class="${k === chosenK ? 'chosen' : ''}"><td class="m">${rt.net}/${rt.p}</td><td class="m">${rt.via || 'directa'}</td><td class="m">${r.ifs[rt.if].n}</td></tr>`).join('') + `</table>`;
}

function resolveARP(sim, id, ifIdx, targetIp, opt) {
  const W = sim.W, n = W.nodes[id], f = n.ifs[ifIdx], me = lbl(W, id, ifIdx);
  const cached = n.arp[targetIp];
  if (cached) {
    think(sim, id, `${id} consulta su caché ARP`, `<p><b>${id}</b> necesita la MAC de <code>${targetIp}</code> para armar la trama. La busca en su caché ARP y la encuentra: <code>${targetIp} → ${cached}</code>.</p><p>Como hay <b>acierto de caché</b>, no se envía ningún mensaje ARP (ahorra una difusión en la red). Las entradas caducan a los pocos minutos para tolerar cambios de placa o de IP.</p>`, 'arp');
    return cached;
  }
  const members = lanMembers(W, f.lan).filter(m => !(m.id === id && m.i === ifIdx));
  const target = members.find(m => W.nodes[m.id].ifs[m.i].ip === targetIp);
  let proxy = null;
  if (!target) proxy = members.find(m => { const r = W.nodes[m.id]; if (r.kind !== 'router' || !r.proxyArp) return false; const rt = lookup(r, targetIp); return rt && rt.if !== m.i; });
  const resp = target || proxy;
  const learn = [], to = [];
  members.forEach(m => {
    const mn = W.nodes[m.id];
    const isResp = resp && m.id === resp.id && m.i === resp.i;
    if (isResp && !proxy) { mn.arp[f.ip] = f.mac; learn.push(`${m.id} guarda en su caché: ${f.ip} → ${f.mac} (aprende al ver la solicitud)`); }
    else if (mn.arp[f.ip]) { mn.arp[f.ip] = f.mac; learn.push(`${m.id} actualiza su entrada ${f.ip} → ${f.mac}`); }
    to.push({ id:m.id, i:m.i, ok:!!isResp, note:isResp ? (proxy ? 'responde (proxy)' : 'es mi IP: responde') : 'no es mi IP: descarta' });
  });
  push(sim, { type:'tx', kind:'arp', tok:'ARP ?', lan:f.lan, from:{ id, i:ifIdx }, to, dstMac:BCAST,
    title:`ARP Request: «¿quién tiene ${targetIp}?»`,
    html:`<p><b>${me}</b> no tiene la MAC de <code>${targetIp}</code> en su caché. Envía una <b>difusión</b> (MAC destino <code>FF:FF:FF:FF:FF:FF</code>) preguntando a todos los de la ${LANS[f.lan].name}. El mensaje ARP viaja <b>directo dentro de la trama Ethernet</b> (EtherType 0x0806), sin cabecera IP.</p>
      <p>El mensaje ya incluye el par (IP, MAC) del emisor para que el destinatario lo aprenda y no tenga que preguntar de vuelta. La difusión <b>no cruza routers</b>: ARP sólo funciona dentro de una red local.</p>`,
    learn, layers:[eth(BCAST, f.mac, ETYPE.arp), arpL({ oper:'1 (solicitud)', sha:f.mac, spa:f.ip, tha:ZERO, tpa:targetIp })],
    mcq:mkMcq(W, BCAST, null, sim.steps.length) });
  if (!resp) {
    think(sim, id, `Nadie responde al ARP`, `<p>Ningún dispositivo de la ${LANS[f.lan].name} tiene la IP <code>${targetIp}</code>, así que no llega ningún ARP Reply. <b>${id}</b> reintenta unas veces y, al agotar el tiempo, no puede construir la trama.</p><p>La capa IP declara el destino como <b>inalcanzable</b>${n.kind === 'router' ? ' y el router avisará al origen con un mensaje ICMP «Host unreachable»' : ' y avisa a la aplicación (error «host de destino inaccesible»)'}.</p>`, 'icmperr');
    return null;
  }
  const rf = W.nodes[resp.id].ifs[resp.i];
  n.arp[targetIp] = rf.mac;
  push(sim, { type:'tx', kind:'arp', tok:'ARP !', lan:f.lan, from:{ id:resp.id, i:resp.i }, to:[{ id, i:ifIdx, ok:true, note:'aprende la MAC' }], dstMac:f.mac,
    title:`ARP Reply: «${targetIp} está en ${rf.mac}»`,
    html:`<p><b>${lbl(W, resp.id, resp.i)}</b> ${proxy ? `no es dueño de <code>${targetIp}</code>, pero sabe llegar a esa red por otra interfaz: hace <b>proxy ARP</b> y contesta con <b>su propia MAC</b>, de modo que el host le entregue a él las tramas.` : `es el dueño de <code>${targetIp}</code> y contesta por <b>unicast</b> (sólo a quien preguntó).`}</p>
      <p><b>${me}</b> guarda <code>${targetIp} → ${rf.mac}</code> en su caché ARP y ya puede enviar la trama de datos.</p>`,
    learn:[`${id} guarda en su caché: ${targetIp} → ${rf.mac}`], layers:[eth(f.mac, rf.mac, ETYPE.arp), arpL({ oper:'2 (respuesta)', sha:rf.mac, spa:targetIp, tha:f.mac, tpa:f.ip })],
    mcq:mkMcq(W, f.mac, null, sim.steps.length) });
  return rf.mac;
}

/* Envía un datagrama IP desde srcId hasta pkt.dst, resolviendo ARP y ruteando salto a salto */
function sendIP(sim, srcId, pkt, opt = {}) {
  const W = sim.W;
  let curId = srcId, inIf = null, first = true, hop = 0, ttl = pkt.ttl;
  const l4 = () => [].concat(pkt.l4());
  for (let g = 0; g < 12; g++) {
    const cur = W.nodes[curId];
    const own = cur.ifs.findIndex(f => f.ip === pkt.dst);
    if (!first && own >= 0) return { delivered:true, node:curId, ifIdx:own, ttl };
    if (!first && cur.kind === 'host') { think(sim, curId, `${curId} descarta el paquete`, `<p>La IP destino <code>${pkt.dst}</code> no es de <b>${curId}</b> y los hosts no reenvían paquetes.</p>`); return { delivered:false, reason:'misdelivered' }; }
    let out;
    if (cur.kind === 'host') {
      const f = cur.ifs[0];
      if (!f.ip) { think(sim, curId, `${curId} no tiene IP`, `<p>Sin dirección IP no puede originar paquetes.</p>`); return { delivered:false, reason:'noip' }; }
      const mask = n2ip(maskN(f.p)), myNet = netOf(f.ip, f.p), dNet = netOf(pkt.dst, f.p), loc = myNet === dNet;
      think(sim, curId, `${curId} decide: ¿destino local o remoto?`,
        `<p>${pkt.why || ''} Para saber a quién entregar la trama, <b>${curId}</b> aplica su máscara <code>${mask}</code> (/${f.p}) a la IP destino y a la suya:</p>
         <p class="calc"><code>${pkt.dst} AND ${mask} = ${dNet}</code><br><code>${f.ip} AND ${mask} = ${myNet}</code></p>
         <p>${loc ? `Coinciden → el destino está en <b>mi misma red</b>. Entrega directa: necesito la MAC de <code>${pkt.dst}</code>.`
                  : `No coinciden → el destino está en <b>otra red</b>. Lo envío al <b>router por defecto</b> <code>${cur.gw}</code>: necesito la MAC <b>del gateway</b>, no la del destino final.`}</p>`);
      if (!loc && !cur.gw) { think(sim, curId, 'Sin gateway configurado', `<p>No hay router por defecto: el paquete no puede salir de la red local.</p>`); return { delivered:false, reason:'nogw' }; }
      out = { i:0, next:loc ? pkt.dst : cur.gw };
    } else {
      if (!first) {
        ttl -= 1;
        if (ttl <= 0) {
          think(sim, curId, `${curId}: el TTL llega a 0`, `<p><b>${curId}</b> recibió el datagrama por ${lbl(W, curId, inIf)}, le resta 1 al TTL y obtiene <b>0</b>. Un router nunca reenvía un datagrama con TTL agotado: lo <b>descarta</b> (evita bucles de enrutamiento) y avisa al origen con ICMP «Time Exceeded».</p>`, 'icmperr');
          let err = null;
          if (!pkt.isErr) err = icmpError(sim, curId, inIf, pkt, 11, 0, 'Se agotó el TTL del datagrama (tipo 11, código 0).');
          return { delivered:false, reason:'ttl', by:curId, byIp:cur.ifs[inIf].ip, err };
        }
      }
      const r = lookup(cur, pkt.dst);
      think(sim, curId, first ? `${curId} genera el paquete y consulta su tabla de rutas` : `${curId} reenvía: decrementa TTL y consulta su tabla de rutas`,
        `<p>${first ? (pkt.why || `<b>${curId}</b> origina este paquete.`) : `<b>${curId}</b> recibió la trama por ${lbl(W, curId, inIf)}, comprobó que la MAC destino era la suya y desencapsuló el datagrama. La IP destino (<code>${pkt.dst}</code>) <b>no es suya</b>, así que debe reenviarlo. Resta 1 al TTL: <code>${ttl + 1} → ${ttl}</code>.`}</p>
         <p>Busca <code>${pkt.dst}</code> en su tabla de rutas (coincidencia más específica):</p>${routeTableHtml(cur, r ? r.k : -1)}
         <p>${r ? (r.via ? `La ruta elegida no es directa: siguiente salto <code>${r.via}</code> (otro router). Necesito la MAC de <b>ese router</b>.` : `Red conectada directamente: el destino está en la ${LANS[cur.ifs[r.if].lan].name}. Necesito la MAC <b>del destino final</b>.`) : `<b>No hay ninguna ruta</b> que coincida.`}</p>`);
      if (!r) {
        let err = null;
        if (!pkt.isErr) err = icmpError(sim, curId, inIf == null ? 0 : inIf, pkt, 3, 0, 'No existe ruta hacia la red destino (tipo 3, código 0).');
        return { delivered:false, reason:'noroute', by:curId, err };
      }
      out = { i:r.if, next:r.via || pkt.dst };
    }
    const mac = resolveARP(sim, curId, out.i, out.next, opt);
    if (!mac) {
      let err = null;
      if (cur.kind === 'router' && !pkt.isErr) err = icmpError(sim, curId, inIf == null ? 0 : inIf, pkt, 3, 1, 'El router no logró resolver la MAC del destino por ARP (tipo 3, código 1).');
      return { delivered:false, reason:'arp', by:curId, byIp:inIf != null ? cur.ifs[inIf].ip : null, err };
    }
    const f = cur.ifs[out.i], rcv = findMac(W, mac);
    const hl = hop > 0 ? { src:true, dst:true, ttl:ttl !== pkt.ttl } : {};
    const who = lbl(W, rcv.id, rcv.i);
    push(sim, { type:'tx', kind:pkt.kind || 'ip', tok:pkt.tok || 'IP', lan:f.lan, from:{ id:curId, i:out.i }, to:[{ id:rcv.id, i:rcv.i, ok:true, note:rcv.id === findIp(W, pkt.dst)?.id ? 'destino final' : 'siguiente salto' }], dstMac:mac,
      title:`${lbl(W, curId, out.i)} → ${who}: ${pkt.name}`,
      html:`<p>Trama en la ${LANS[f.lan].name}. ${out.next !== pkt.dst ? `La <b>MAC destino</b> es la del siguiente salto (<b>${who}</b>), aunque la <b>IP destino</b> siga siendo la del destino final <code>${pkt.dst}</code>.` : `El destino IP está en esta red: la MAC destino es la del destino final (<b>${who}</b>).`}</p>
        <p>${hop === 0 ? 'Esta es la primera trama: sus direcciones MAC y su TTL servirán de comparación con los saltos siguientes.' : '<b>Lo que cambió respecto del salto anterior:</b> MAC origen y MAC destino (se reescriben en cada red) y el TTL (−1 por router). Las IP origen y destino <b>no cambian</b>.'}</p>`,
      layers:[eth(mac, f.mac, ETYPE.ip, hl), ipL({ ...pkt, ttl }, hl), ...l4()],
      hop:{ lan:LANS[f.lan].name, from:lbl(W, curId, out.i), to:who, smac:f.mac, dmac:mac, sip:pkt.src, dip:pkt.dst, ttl, name:pkt.name },
      mcq:mkMcq(W, mac, pkt.dst, sim.steps.length) });
    curId = rcv.id; inIf = rcv.i; first = false; hop++;
  }
  return { delivered:false, reason:'loop' };
}

function icmpError(sim, rid, ingIf, orig, type, code, why) {
  const r = sim.W.nodes[rid], srcIp = r.ifs[ingIf].ip;
  const err = { src:srcIp, dst:orig.src, ttl:64, proto:1, kind:'icmperr', tok:'ICMP', isErr:true, name:`ICMP ${ICMP_T[type]}`,
    why:`${why} Debe informar al origen (<code>${orig.src}</code>) con un mensaje ICMP: se encapsula en un datagrama IP (protocolo 1) cuya IP origen es la de la interfaz de entrada, <code>${srcIp}</code>.`,
    l4:() => icmpL(type, code, [['Datos', 'Cabecera IP original + primeros 8 bytes del datagrama que causó el error']]) };
  return sendIP(sim, rid, err);
}

/* =====================================================================
   3. ESCENARIOS
   ===================================================================== */
const hostOpts = ids => ids.map(id => [id, `${id} (${BASE.nodes[id].ifs[0].ip})`]);
const ALLH = ['A', 'B', 'S', 'C', 'D'];
const udpPkt = (src, dst, ttl, extra = {}) => ({ src, dst, ttl, proto:17, kind:'ip', tok:'UDP', name:'Datagrama UDP', l4:() => udpL(49152, 5000), ...extra });
const SC = {};

/* ---------- 1. Viaje del paquete ---------- */
SC.route = {
  label:'1. Viaje del paquete', title:'Un paquete atraviesa routers: ARP en cada salto',
  intro:'Un host envía un datagrama a otro host de una red remota. Observá que la <b>IP origen/destino no cambia</b> de punta a punta, mientras que las <b>MAC se reescriben en cada red</b> y cada router decrementa el TTL. Cada MAC se descubre con ARP.',
  fields:[
    { id:'src', label:'Origen', type:'select', opts:hostOpts(ALLH), def:'A' },
    { id:'dst', label:'Destino', type:'select', opts:hostOpts(ALLH), def:'D' },
    { id:'ttl', label:'TTL inicial', type:'number', def:64, min:1, max:255 }
  ],
  presets:[ { label:'A → D (tres redes, dos routers)', cfg:{ src:'A', dst:'D', ttl:64 } }, { label:'A → B (misma LAN, sin routers)', cfg:{ src:'A', dst:'B', ttl:64 } }, { label:'C → B (sentido inverso)', cfg:{ src:'C', dst:'B', ttl:64 } }, { label:'A → D con TTL 2 (muere en R2)', cfg:{ src:'A', dst:'D', ttl:2 } } ],
  gen(sim, cfg) {
    const W = sim.W, s = W.nodes[cfg.src], d = W.nodes[cfg.dst];
    if (cfg.src === cfg.dst) { think(sim, cfg.src, 'Origen y destino iguales', '<p>Elegí dos dispositivos distintos.</p>'); return; }
    const same = s.ifs[0].lan === d.ifs[0].lan, ttl = Math.max(1, Math.min(255, +cfg.ttl || 64));
    think(sim, cfg.src, `${cfg.src} quiere enviar un datagrama a ${cfg.dst}`,
      `<p>Una aplicación de <b>${cfg.src}</b> entrega a la capa IP un datagrama destinado a <code>${d.ifs[0].ip}</code>. IP trabaja con direcciones IP, pero la placa Ethernet sólo envía tramas con una <b>MAC destino</b> concreta, así que alguien tiene que averiguar esa MAC.</p>
       <p>${same ? 'Origen y destino están en la <b>misma red</b>: no hay routers de por medio.' : `Origen y destino están en redes distintas (<b>${LANS[s.ifs[0].lan].name}</b> y <b>${LANS[d.ifs[0].lan].name}</b>): el datagrama pasará por routers, y en cada red hará falta la MAC del siguiente salto.`} Las cachés ARP ${$('#clr').checked ? 'empiezan vacías' : 'conservan lo aprendido en simulaciones anteriores'}.</p>`);
    const r = sendIP(sim, cfg.src, udpPkt(s.ifs[0].ip, d.ifs[0].ip, ttl));
    if (r.delivered) {
      const nArp = sim.steps.filter(x => x.kind === 'arp' && x.type === 'tx').length;
      think(sim, cfg.dst, `${cfg.dst} recibe el datagrama`,
        `<p>La MAC destino es la suya y la IP destino también: desencapsula y entrega el segmento a UDP. El camino completo fueron <b>${sim.steps.filter(x => x.hop).length} trama(s)</b> de datos${nArp ? ` precedidas por <b>${nArp} mensajes ARP</b>` : ' (todo estaba en caché: no hizo falta ARP)'}.</p>
         <p>Mirá la tabla «Tramas que transportaron el datagrama»: IP origen e IP destino son iguales en todas las filas; las MAC y el TTL cambian.</p>`);
    }
  },
  theory:`<p><b>Direccionamiento en dos niveles.</b> La dirección IP identifica al host de extremo a extremo; la dirección MAC sólo tiene sentido dentro de una red local (salto a salto). Para ir de A a D, A no necesita la MAC de D: necesita la de su <b>router por defecto</b>.</p>
  <ul><li><b>Host:</b> aplica la máscara. Si el destino está en su red → ARP por la IP del destino. Si no → ARP por la IP del gateway.</li>
  <li><b>Router:</b> recibe la trama, comprueba que la MAC destino es suya, desencapsula, decrementa el TTL (y recalcula el checksum de cabecera), busca en la tabla de rutas y vuelve a encapsular en una trama <i>nueva</i> hacia el siguiente salto, resolviendo su MAC con ARP si hace falta.</li>
  <li><b>Último router:</b> el destino está en una red conectada directamente, así que hace ARP por la IP del <i>destino final</i>.</li>
  <li><b>Caché ARP:</b> evita repetir la difusión. Además cada solicitud enseña al destinatario la MAC del que preguntó; por eso el camino de vuelta normalmente no necesita nuevos ARP.</li></ul>
  <p>Probá desmarcar «Vaciar las cachés» y simular dos veces seguidas: la segunda vez sólo aparecen aciertos de caché.</p>`
};

/* ---------- 2. ARP ---------- */
SC.arp = {
  label:'2. ARP', title:'ARP: resolución de direcciones IP → MAC',
  intro:'ARP (RFC 826) permite que un dispositivo averigüe la MAC que corresponde a una IP de <b>su misma red local</b>. Probá la resolución normal, qué pasa si la IP no existe, el ARP gratuito (anuncio) y el proxy ARP.',
  fields:[
    { id:'variant', label:'Variante', type:'select', opts:[['normal', 'Resolución normal'], ['timeout', 'IP inexistente (sin respuesta)'], ['gratuito', 'ARP gratuito (cambio de placa)'], ['proxy', 'Proxy ARP (R1 contesta por D)']], def:'normal' },
    { id:'src', label:'Quien pregunta', type:'select', opts:hostOpts(['A', 'B', 'S']), def:'A' },
    { id:'dst', label:'IP buscada', type:'text', def:'192.168.1.20', show:c => c.variant !== 'gratuito' }
  ],
  presets:[ { label:'A busca a B', cfg:{ variant:'normal', src:'A', dst:'192.168.1.20' } }, { label:'A busca una IP que no existe', cfg:{ variant:'timeout', src:'A', dst:'192.168.1.99' } }, { label:'ARP gratuito de A', cfg:{ variant:'gratuito', src:'A' } }, { label:'Proxy ARP: A busca a D', cfg:{ variant:'proxy', src:'A', dst:'172.16.0.20' } } ],
  noCommit:c => c.variant === 'gratuito' || c.variant === 'proxy',
  gen(sim, cfg) {
    const W = sim.W, s = W.nodes[cfg.src], sf = s.ifs[0];
    if (cfg.variant === 'gratuito') {
      const seeded = cfg.src === 'A' ? 'B' : 'A', sn = W.nodes[seeded], oldMac = sf.mac, newMac = '02:00:00:00:99:' + oldMac.slice(-2);
      sn.arp[sf.ip] = oldMac; sim.init = snapshot(W);
      think(sim, cfg.src, 'Situación previa', `<p><b>${seeded}</b> ya tenía en su caché ARP la entrada <code>${sf.ip} → ${oldMac}</code> (de una comunicación anterior). Los demás dispositivos no tienen entrada para <b>${cfg.src}</b>.</p>`, 'arp');
      sf.mac = newMac;
      think(sim, cfg.src, `${cfg.src} cambia de placa de red`, `<p>Se reemplaza la placa de <b>${cfg.src}</b>: ahora su MAC es <code>${newMac}</code>, pero conserva la IP <code>${sf.ip}</code>. Las cachés ajenas quedaron <b>desactualizadas</b> (hasta que la entrada caduque, las tramas se perderían).</p><p>Para evitarlo, al arrancar o cambiar de MAC el host envía un <b>ARP gratuito</b>: una solicitud sobre su <i>propia</i> IP, que no espera respuesta.</p>`, 'arp');
      const to = lanMembers(W, 'L1').filter(m => m.id !== cfg.src).map(m => ({ id:m.id, i:m.i, ok:m.id === seeded ? 'upd' : false, note:m.id === seeded ? 'actualiza su caché' : 'sin entrada: la ignora' }));
      sn.arp[sf.ip] = newMac;
      push(sim, { type:'tx', kind:'arp', tok:'ARP ?', lan:'L1', from:{ id:cfg.src, i:0 }, to, dstMac:BCAST, title:`ARP gratuito: «${sf.ip} ahora está en ${newMac}»`,
        html:`<p>Solicitud ARP <b>difundida</b> donde <b>IP emisor = IP objetivo</b> (<code>${sf.ip}</code>). Nadie contestará: no es una pregunta, es un anuncio.</p><p>Los dispositivos que <b>ya tenían</b> una entrada para esa IP la actualizan (${seeded}); los que no, la ignoran. Un efecto colateral útil: si <i>alguien contesta</i>, hay una IP duplicada en la red.</p>`,
        learn:[`${seeded} actualiza: ${sf.ip} → ${newMac} (antes ${oldMac})`], layers:[eth(BCAST, newMac, ETYPE.arp), arpL({ oper:'1 (solicitud)', sha:newMac, spa:sf.ip, tha:ZERO, tpa:sf.ip })], mcq:mkMcq(W, BCAST, null, sim.steps.length) });
      think(sim, seeded, `${seeded} vuelve a escribirle a ${cfg.src}`, `<p>Ahora <b>${seeded}</b> envía un datagrama a <code>${sf.ip}</code>. Su caché ya tiene la MAC nueva, así que <b>no hace falta ARP</b> y la trama llega bien.</p>`, 'arp');
      sendIP(sim, seeded, udpPkt(sn.ifs[0].ip, sf.ip, 64));
      return;
    }
    if (!validIp(cfg.dst)) { think(sim, cfg.src, 'IP inválida', `<p>«${esc(cfg.dst)}» no es una dirección IPv4 válida.</p>`); return; }
    if (cfg.dst === sf.ip) { think(sim, cfg.src, 'IP propia', '<p>Elegí una IP distinta de la del propio host.</p>'); return; }
    if (cfg.variant === 'proxy') {
      W.nodes.R1.proxyArp = true; sf.p = 0; sim.init = snapshot(W);
      think(sim, cfg.src, 'Configuración particular de esta variante', `<p><b>${cfg.src}</b> está mal configurado: tiene máscara <code>0.0.0.0</code>, así que cree que <i>todas</i> las IP están en su red local. <b>R1</b> tiene habilitado <b>proxy ARP</b>: contesta ARP por IP que sabe alcanzar por otra interfaz.</p><p>Resultado: ${cfg.src} no necesita saber que existe un gateway; el router se "hace pasar" por los hosts remotos.</p>`, 'arp');
    } else {
      think(sim, cfg.src, `${cfg.src} quiere comunicarse con ${cfg.dst}`, `<p>Conoce la IP <code>${cfg.dst}</code> (por ejemplo, la resolvió un DNS) pero no su MAC. Antes de poder enviar la trama, ARP debe resolverla.</p>`, 'arp');
    }
    sendIP(sim, cfg.src, udpPkt(sf.ip, cfg.dst, 64));
  },
  theory:`<p><b>El problema.</b> Las capas superiores usan direcciones IP; la placa Ethernet sólo entiende MAC de 48 bits. Tanenbaum plantea las alternativas (tablas de configuración en cada host, o direcciones MAC derivadas de la IP) y explica por qué se usa ARP: es dinámico y no exige configuración.</p>
  <ul><li><b>Solicitud:</b> difusión Ethernet (FF:FF:FF:FF:FF:FF): «¿Quién tiene la IP X? Que le diga a Y (IP, MAC)».</li>
  <li><b>Respuesta:</b> sólo el dueño de X contesta, por <b>unicast</b>, con su MAC.</li>
  <li><b>Caché:</b> el resultado se guarda con tiempo de vida (minutos). Optimizaciones: el mensaje lleva el par IP/MAC del emisor, que el destinatario aprende; los demás actualizan entradas que ya tenían.</li>
  <li><b>ARP gratuito:</b> el host anuncia su propia IP al arrancar o al cambiar de MAC; sirve para refrescar cachés y detectar IP duplicadas.</li>
  <li><b>Proxy ARP:</b> un router contesta por hosts de otra red con su propia MAC (útil con subredes o hosts sin gateway configurado).</li>
  <li><b>Entre redes:</b> la difusión no atraviesa routers, así que ARP sólo resuelve direcciones de la red local. Para un destino remoto, el host hace ARP del <i>gateway</i>.</li></ul>
  <p>ARP <b>no viaja dentro de IP</b>: el mensaje va directamente en la trama Ethernet (EtherType 0x0806); por eso funciona aunque el host todavía no tenga IP.</p>`
};

/* ---------- 3. RARP ---------- */
SC.rarp = {
  label:'3. RARP', title:'RARP: de la MAC a la IP',
  intro:'RARP (RFC 903) resuelve el problema inverso: una estación sin disco conoce su MAC (viene en la placa) pero no su IP. Probá con el servidor en la misma LAN y en otra LAN para ver su limitación principal.',
  fields:[
    { id:'client', label:'Cliente sin IP', type:'select', opts:hostOpts(['A', 'B']), def:'A' },
    { id:'where', label:'Servidor RARP', type:'select', opts:[['local', 'En la misma LAN (S)'], ['remoto', 'En otra LAN (D, detrás de los routers)']], def:'local' },
    { id:'entry', label:'', type:'checkbox', text:'La MAC del cliente está en la tabla del servidor', def:true }
  ],
  presets:[ { label:'Servidor en la misma LAN', cfg:{ client:'A', where:'local', entry:true } }, { label:'Servidor en otra LAN', cfg:{ client:'A', where:'remoto', entry:true } }, { label:'MAC no registrada', cfg:{ client:'B', where:'local', entry:false } } ],
  noCommit:() => true,
  gen(sim, cfg) {
    const W = sim.W, c = W.nodes[cfg.client], cf = c.ifs[0], own = cf.ip, here = cfg.where === 'local';
    cf.ip = null; c.gw = null; sim.init = snapshot(W);
    think(sim, cfg.client, `${cfg.client} arranca sin dirección IP`, `<p>Un equipo sin disco no puede leer su IP de un archivo de configuración. Sólo conoce su <b>MAC</b> <code>${cf.mac}</code>, fija en la placa. Debe preguntar en la red: «esta es mi MAC, ¿cuál es mi IP?».</p>`, 'rarp');
    const to = lanMembers(W, 'L1').filter(m => m.id !== cfg.client).map(m => ({ id:m.id, i:m.i, ok:here && m.id === 'S', note:m.id === 'S' ? (here ? 'servidor RARP: procesa' : 'no es servidor: descarta') : (m.id === 'R1' ? 'router: no reenvía difusiones' : 'no es servidor: descarta') }));
    push(sim, { type:'tx', kind:'rarp', tok:'RARP ?', lan:'L1', from:{ id:cfg.client, i:0 }, to, dstMac:BCAST, title:`RARP Request: «mi MAC es ${cf.mac}, ¿cuál es mi IP?»`,
      html:`<p>El cliente <b>difunde</b> una solicitud RARP (EtherType <code>0x8035</code>, operación 3). Como no tiene IP, el mensaje no puede ir en un datagrama IP: va <b>directamente sobre Ethernet</b>. Los campos de IP quedan vacíos.</p><p>Sólo un <b>servidor RARP</b> que esté en esta misma red física responderá; los demás descartan el mensaje.</p>`,
      layers:[eth(BCAST, cf.mac, ETYPE.rarp), arpL({ name:'Mensaje RARP', oper:'3 (solicitud RARP)', sha:cf.mac, spa:'(desconocida)', tha:cf.mac, tpa:'(la busca: «¿cuál es mi IP?»)' })], mcq:mkMcq(W, BCAST, null, sim.steps.length) });
    if (!here) {
      think(sim, 'R1', 'R1 no reenvía la difusión', `<p>El servidor está en la ${LANS.L3.name}, pero <b>los routers no reenvían tramas de difusión</b> ni entienden RARP (es un protocolo de capa de enlace, sin cabecera IP que rutear). La solicitud muere en la ${LANS.L1.name}.</p>`, 'icmperr');
      think(sim, cfg.client, 'Sin respuesta: el cliente no puede arrancar', `<p>Tras varios reintentos, <b>${cfg.client}</b> sigue sin IP. <b>Limitación clave de RARP:</b> requiere un servidor en <b>cada red local</b>. Esto motivó a BOOTP (que usa UDP/IP y agentes de retransmisión) y luego a DHCP.</p>`, 'icmperr');
      return;
    }
    const tbl = `<table class="mini"><tr><th>MAC</th><th>IP</th></tr>${['A', 'B'].filter(x => cfg.entry || x !== cfg.client).map(x => `<tr class="${x === cfg.client ? 'chosen' : ''}"><td class="m">${BASE.nodes[x].ifs[0].mac}</td><td class="m">${BASE.nodes[x].ifs[0].ip}</td></tr>`).join('')}</table>`;
    if (!cfg.entry) {
      think(sim, 'S', 'S no encuentra la MAC en su tabla', `<p>El servidor busca <code>${cf.mac}</code> en su tabla de correspondencias (la configuró un administrador a mano):</p>${tbl}<p>No hay entrada: <b>no responde</b>. RARP no asigna direcciones dinámicamente; sólo consulta una tabla estática.</p>`, 'rarp');
      think(sim, cfg.client, 'Sin respuesta', `<p>El cliente agota los reintentos y no puede configurarse.</p>`, 'icmperr');
      return;
    }
    think(sim, 'S', 'S busca la MAC en su tabla', `<p>El servidor RARP consulta su tabla estática:</p>${tbl}<p>Encuentra <code>${cf.mac} → ${own}</code> y prepara la respuesta.</p>`, 'rarp');
    const sf = W.nodes.S.ifs[0]; cf.ip = own;
    push(sim, { type:'tx', kind:'rarp', tok:'RARP !', lan:'L1', from:{ id:'S', i:0 }, to:[{ id:cfg.client, i:0, ok:true, note:'conoce su IP' }], dstMac:cf.mac, title:`RARP Reply: «tu IP es ${own}»`,
      html:`<p>El servidor contesta por <b>unicast</b> a la MAC del cliente (operación 4). En el campo «IP objetivo» va la dirección asignada. Ahora <b>${cfg.client}</b> ya tiene IP.</p>`,
      layers:[eth(cf.mac, sf.mac, ETYPE.rarp), arpL({ name:'Mensaje RARP', oper:'4 (respuesta RARP)', sha:sf.mac, spa:sf.ip, tha:cf.mac, tpa:own })], mcq:mkMcq(W, cf.mac, null, sim.steps.length) });
    think(sim, cfg.client, 'Limitaciones de RARP', `<p><b>${cfg.client}</b> conoce su IP, pero RARP <b>no entrega máscara, gateway ni DNS</b>: sin gateway no podrá hablar con otras redes. Además necesita un servidor por red y una tabla manual. BOOTP y DHCP resuelven esto (pestañas siguientes).</p>`, 'rarp');
  },
  theory:`<p><b>Idea.</b> RARP (<i>Reverse ARP</i>) hace lo opuesto a ARP: parte de una MAC conocida y pide una IP. Pensado para estaciones sin disco que arrancaban por red (Tanenbaum lo presenta como antecedente de BOOTP y DHCP).</p>
  <ul><li>Usa el mismo formato de mensaje que ARP, con operaciones 3 (solicitud) y 4 (respuesta), y EtherType propio <code>0x8035</code>.</li>
  <li>Se difunde a nivel de enlace: <b>no atraviesa routers</b> → hace falta un servidor RARP en cada LAN.</li>
  <li>El servidor es una tabla manual MAC → IP, y sólo devuelve la IP (sin máscara, gateway ni servidor de nombres).</li>
  <li>Al no usar IP/UDP, es incómodo de implementar como un proceso de usuario normal.</li></ul>
  <p>Hoy está obsoleto: lo reemplazó BOOTP (UDP/IP, con agentes de retransmisión) y finalmente DHCP.</p>`
};

/* ---------- 3b. BOOTP ---------- */
const bootpL = o => ({ name:'Mensaje BOOTP', fields:[['op', o.op], ['xid', o.xid], ['ciaddr', o.ciaddr || '0.0.0.0'], ['yiaddr', o.yiaddr || '0.0.0.0'], ['siaddr', o.siaddr || '0.0.0.0'], ['giaddr', o.giaddr || '0.0.0.0'], ['chaddr', o.chaddr], ['file', o.file || '—'], ['vend (extensiones)', o.vend || '—']] });
SC.bootp = {
  label:'4. BOOTP', title:'BOOTP: arranque por red sobre UDP/IP',
  intro:'BOOTP (RFC 951) apareció para reemplazar a RARP en el arranque de estaciones sin disco. Viaja <b>sobre UDP/IP</b> (puertos 67/68), así que un agente de retransmisión puede llevarlo a otra red, y además de la IP entrega máscara, router y el servidor y archivo de arranque. Son sólo <b>dos mensajes</b> y la asignación es <b>estática</b> (tabla MAC → IP).',
  fields:[
    { id:'client', label:'Cliente sin disco', type:'select', opts:hostOpts(['A', 'B']), def:'A' },
    { id:'where', label:'Servidor BOOTP', type:'select', opts:[['local', 'En la misma LAN (S)'], ['relay', 'En otra LAN (D) vía relay en R1']], def:'local' },
    { id:'entry', label:'', type:'checkbox', text:'La MAC del cliente está en la tabla del servidor', def:true },
    { id:'tftp', label:'', type:'checkbox', text:'Mostrar la descarga posterior por TFTP', def:false }
  ],
  presets:[ { label:'Servidor en la misma LAN', cfg:{ client:'A', where:'local', entry:true, tftp:false } }, { label:'Servidor remoto con relay', cfg:{ client:'A', where:'relay', entry:true, tftp:false } }, { label:'Arranque completo con TFTP', cfg:{ client:'B', where:'local', entry:true, tftp:true } }, { label:'MAC no registrada', cfg:{ client:'A', where:'local', entry:false, tftp:false } } ],
  noCommit:() => true,
  gen(sim, cfg) {
    const W = sim.W, cid = cfg.client, c = W.nodes[cid], cf = c.ifs[0], relay = cfg.where === 'relay';
    const sid = relay ? 'D' : 'S', sf = W.nodes[sid].ifs[0], mymac = cf.mac, own = cf.ip;
    const xid = '0x6B1D0A52', gwIp = '192.168.1.1', mask = '255.255.255.0', file = 'arranque.img';
    const vend = `máscara ${mask} · router ${gwIp} · DNS 8.8.8.8`;
    cf.ip = null; c.gw = null; sim.init = snapshot(W);
    const members = () => lanMembers(W, 'L1').filter(m => m.id !== cid);
    const tbl = `<table class="mini"><tr><th>MAC</th><th>IP asignada</th><th>Archivo</th></tr>${['A', 'B'].filter(x => cfg.entry || x !== cid).map(x => `<tr class="${x === cid ? 'chosen' : ''}"><td class="m">${BASE.nodes[x].ifs[0].mac}</td><td class="m">${BASE.nodes[x].ifs[0].ip}</td><td class="m">${file}</td></tr>`).join('')}</table>`;
    const noEntry = who => {
      think(sim, who, `${who} no encuentra la MAC en su tabla`, `<p>El servidor busca <code>${mymac}</code> en la tabla que armó el administrador:</p>${tbl}<p>No hay entrada: <b>no responde</b>. BOOTP no inventa direcciones; cada máquina debe estar registrada de antemano (a diferencia de DHCP).</p>`, 'icmperr');
      think(sim, cid, 'Sin respuesta', `<p>El cliente reintenta con espera creciente y finalmente no puede arrancar.</p>`, 'icmperr');
    };
    think(sim, cid, `${cid} arranca sin disco ni IP`, `<p>Sólo conoce su MAC. Necesita su IP, la dirección del servidor de arranque y el nombre del archivo a descargar. Como todavía no tiene IP, usa <b>difusión limitada</b>: origen <code>0.0.0.0</code>, destino <code>255.255.255.255</code>, MAC destino <code>FF:FF:FF:FF:FF:FF</code>.</p>`, 'dhcp');
    push(sim, { type:'tx', kind:'dhcp', tok:'BOOTP', lan:'L1', from:{ id:cid, i:0 }, dstMac:BCAST, title:'BOOTREQUEST: «mi MAC es ' + mymac + ', ¿quién soy?»',
      html:`<p>A diferencia de RARP, el pedido ya es un <b>datagrama UDP</b> (puerto 68 → 67) dentro de IP. Sólo el campo <b>chaddr</b> identifica al cliente; <b>xid</b> relaciona pedido y respuesta.</p><p>Los demás campos (ciaddr, yiaddr, siaddr…) van en cero: son los que el servidor deberá llenar.</p>`,
      to:members().map(m => { const isS = !relay && m.id === 'S', isR = relay && m.id === 'R1'; return { id:m.id, i:m.i, ok:isS || isR, note:isS ? 'servidor BOOTP: procesa' : isR ? 'relay agent: procesa' : (m.id === 'R1' ? 'router: no reenvía difusiones' : 'no es servidor: descarta') }; }),
      layers:[eth(BCAST, mymac, ETYPE.ip), ipL({ src:'0.0.0.0', dst:'255.255.255.255', ttl:128, proto:17 }), udpL(68, 67), bootpL({ op:'1 (BOOTREQUEST)', xid, chaddr:mymac })], mcq:mkMcq(W, BCAST, null, sim.steps.length) });
    if (!relay) {
      think(sim, 'S', 'S consulta su tabla MAC → IP', `<p>El servidor BOOTP tiene una tabla estática:</p>${tbl}<p>Encuentra la entrada del cliente y prepara la respuesta con la IP asignada y el archivo de arranque.</p>`, 'dhcp');
      if (!cfg.entry) { noEntry('S'); return; }
      push(sim, { type:'tx', kind:'dhcp', tok:'BOOTP', lan:'L1', from:{ id:'S', i:0 }, to:[{ id:cid, i:0, ok:true, note:'procesa' }], dstMac:mymac, title:`BOOTREPLY: «tu IP es ${own}, arrancá con ${file}»`,
        html:`<p>El servidor responde con <b>yiaddr</b> (la IP del cliente), <b>siaddr</b> (el servidor desde el que bajar la imagen) y <b>file</b> (nombre del archivo). El campo <b>vend</b> lleva extensiones: máscara, router y DNS.</p><p>Se envía a la MAC indicada en <b>chaddr</b>: sin ARP, porque el cliente aún no tiene IP.</p>`,
        layers:[eth(mymac, sf.mac, ETYPE.ip), ipL({ src:sf.ip, dst:own, ttl:64, proto:17 }), udpL(67, 68), bootpL({ op:'2 (BOOTREPLY)', xid, yiaddr:own, siaddr:sf.ip, chaddr:mymac, file, vend })], mcq:mkMcq(W, mymac, own, sim.steps.length) });
    } else {
      think(sim, 'R1', 'R1 (relay) reenvía el pedido al servidor', `<p>R1 es <b>agente de retransmisión</b>: toma la difusión, completa <b>giaddr</b> con <code>${gwIp}</code> (la interfaz por la que llegó) y la reenvía por <b>unicast</b> al servidor <code>${sf.ip}</code>. Esto es lo que RARP no podía hacer.</p>`, 'dhcp');
      const up = sendIP(sim, 'R1', { src:gwIp, dst:sf.ip, ttl:64, proto:17, kind:'dhcp', tok:'BOOTP', name:'BOOTREQUEST (reenviado por el relay)', why:'El relay genera el datagrama unicast.',
        l4:() => [udpL(67, 67), bootpL({ op:'1 (BOOTREQUEST)', xid, giaddr:gwIp, chaddr:mymac })] });
      if (!up.delivered) return;
      think(sim, 'D', 'D consulta su tabla MAC → IP', `<p>El servidor usa <b>chaddr</b> para buscar al cliente y <b>giaddr</b> para saber a quién devolver la respuesta.</p>${tbl}`, 'dhcp');
      if (!cfg.entry) { noEntry('D'); return; }
      sendIP(sim, 'D', { src:sf.ip, dst:gwIp, ttl:64, proto:17, kind:'dhcp', tok:'BOOTP', name:'BOOTREPLY hacia el relay', why:'El servidor responde a <code>giaddr</code> (el relay), no al cliente, que aún no tiene IP.',
        l4:() => [udpL(67, 67), bootpL({ op:'2 (BOOTREPLY)', xid, yiaddr:own, siaddr:sf.ip, giaddr:gwIp, chaddr:mymac, file, vend })] });
      const r1f = W.nodes.R1.ifs[0];
      push(sim, { type:'tx', kind:'dhcp', tok:'BOOTP', lan:'L1', from:{ id:'R1', i:0 }, to:[{ id:cid, i:0, ok:true, note:'procesa' }], dstMac:mymac, title:'R1 entrega el BOOTREPLY al cliente',
        html:`<p>El relay entrega la respuesta a la MAC de <b>chaddr</b> dentro de la ${LANS.L1.name}.</p>`,
        layers:[eth(mymac, r1f.mac, ETYPE.ip), ipL({ src:gwIp, dst:own, ttl:64, proto:17 }), udpL(67, 68), bootpL({ op:'2 (BOOTREPLY)', xid, yiaddr:own, siaddr:sf.ip, giaddr:gwIp, chaddr:mymac, file, vend })], mcq:mkMcq(W, mymac, own, sim.steps.length) });
    }
    cf.ip = own; cf.p = 24; c.gw = gwIp;
    think(sim, cid, `${cid} queda configurado`, `<p>Aplica la IP <code>${own}</code>, la máscara y el router recibidos en <b>vend</b>. Terminó con <b>dos mensajes</b> (DHCP necesita cuatro). La asignación es <b>permanente</b>: no hay concesión ni renovación, y la dirección no se libera para otro equipo.</p>`, 'dhcp');
    if (cfg.tftp) {
      think(sim, cid, 'Descarga de la imagen de arranque', `<p>Con <b>siaddr</b> y <b>file</b> el cliente pide por <b>TFTP</b> (UDP puerto 69) el archivo <code>${file}</code>. Ahora sí tiene IP, así que primero resolverá con ARP la MAC del servidor (o la del gateway si está en otra red).</p>`, 'ip');
      const r = sendIP(sim, cid, { src:own, dst:sf.ip, ttl:64, proto:17, kind:'ip', tok:'TFTP', name:'TFTP Read Request', l4:() => [udpL(49200, 69), { name:'Mensaje TFTP', fields:[['Operación', '1 (RRQ)'], ['Archivo', file], ['Modo', 'octet']] }] });
      if (r.delivered) think(sim, sid, `${sid} comienza a enviar el archivo`, `<p>El servidor TFTP responde con bloques de datos de 512 bytes. Con la imagen descargada, el cliente puede arrancar su sistema operativo.</p>`, 'ip');
    }
  },
  theory:`<p><b>BOOTP</b> (RFC 951; ver también RFC 1542 para su uso con relays) fue la respuesta a las limitaciones de RARP. Tanenbaum lo presenta como paso intermedio hacia DHCP.</p>
  <ul><li><b>Sobre UDP/IP:</b> puertos 67 (servidor) y 68 (cliente). Como va en IP, un <b>agente de retransmisión</b> puede reenviarlo a otra red: no hace falta un servidor por LAN.</li>
  <li><b>Más que una IP:</b> la respuesta incluye <b>yiaddr</b> (IP del cliente), <b>siaddr</b> (servidor de arranque), <b>file</b> (imagen a descargar, p. ej. por TFTP) y el campo <b>vend</b> con extensiones (máscara, router, DNS).</li>
  <li><b>Dos mensajes:</b> BOOTREQUEST (difusión) y BOOTREPLY.</li>
  <li><b>Asignación estática:</b> el administrador mantiene a mano una tabla MAC → IP. No hay concesión ni reutilización de direcciones.</li>
  <li><b>Relación con DHCP:</b> DHCP conserva el formato de mensaje de BOOTP (por eso comparten puertos y campos) y agrega asignación dinámica con concesión, el intercambio de cuatro mensajes y opciones más ricas.</li></ul>`
};

/* ---------- 4. DHCP ---------- */
SC.dhcp = {

  fields:[

  presets:[ { label:'Servidor en la misma LAN', cfg:{ client:'A', where:'local', probe:true, renew:false } }, { label:'Servidor remoto con relay', cfg:{ client:'A', where:'relay', probe:false, renew:false } }, { label:'Con renovación de la concesión', cfg:{ client:'B', where:'local', probe:false, renew:true } } ],
  noCommit:() => true,
  gen(sim, cfg) {

    const offered = cid === 'A' ? '192.168.1.100' : '192.168.1.101', xid = '0x3903F326', mask = '255.255.255.0', gwIp = '192.168.1.1', dns = '8.8.8.8', lease = '86400 s (24 h)';

    const uni = (msg, title, html, opts) => push(sim, { type:'tx', kind:'dhcp', tok:'DHCP', lan:'L1', from:{ id:'S', i:0 }, to:[{ id:cid, i:0, ok:true, note:'procesa' }], dstMac:mymac, title, html,
      layers:[eth(mymac, sf.mac, ETYPE.ip), ipL({ src:sf.ip, dst:offered, ttl:64, proto:17 }), udpL(67, 68), dhcpL({ op:'2 (BOOTREPLY)', msg, xid, yiaddr:offered, chaddr:mymac, opts })], mcq:mkMcq(W, mymac, offered, sim.steps.length) });
    const relayUp = (msg, opts) => {

        layers:[eth(mymac, r1f.mac, ETYPE.ip), ipL({ src:gwIp, dst:offered, ttl:64, proto:17 }), udpL(67, 68), dhcpL({ op:'2 (BOOTREPLY)', msg, xid, yiaddr:offered, giaddr:gwIp, chaddr:mymac, opts })], mcq:mkMcq(W, mymac, offered, sim.steps.length) });

      uni('OFFER', `DHCPOFFER: «te ofrezco ${offered}»`, `<p>El servidor propone la configuración (<b>yiaddr</b> = IP ofrecida). Como el cliente todavía no tiene IP, la trama se envía a su MAC (<b>chaddr</b>) y no hay ARP. Si hubiera varios servidores, el cliente recibiría varias ofertas.</p>`, optOffer);

      relayDown('OFFER', optOffer);
    }
    bcast('REQUEST', `DHCPREQUEST: «acepto ${offered} de ${sf.ip}»`, `<p>El cliente elige una oferta y la <b>solicita formalmente</b>. Lo hace por <b>difusión</b>, incluyendo el identificador del servidor elegido (opción 54), para que los demás servidores sepan que su oferta fue rechazada y liberen la dirección reservada.</p>`, `53=3 (Request) · 50=${offered} (IP pedida) · 54=${sf.ip} (servidor elegido)`);
    if (!relay) {
      think(sim, 'S', 'S confirma la concesión', `<p>El servidor registra que <code>${offered}</code> queda asignada a <code>${mymac}</code> durante ${lease} (<b>lease</b>).</p>`, 'dhcp');
      uni('ACK', 'DHCPACK: «confirmado, es tuya por 24 h»', `<p>El servidor confirma la configuración completa: IP, máscara, gateway, DNS y tiempo de concesión.</p>`, optAck);
    } else {
      relayUp('REQUEST', `53=3 (Request) · 50=${offered} · 54=${sf.ip}`);
      relayDown('ACK', optAck);
    }
    cf.ip = offered; cf.p = 24; c.gw = gwIp;
    think(sim, cid, `${cid} queda configurado (estado BOUND)`, `<p>El cliente aplica: IP <code>${offered}</code>, máscara <code>${mask}</code>, gateway <code>${gwIp}</code> y DNS <code>${dns}</code>. Arranca los temporizadores de la concesión: <b>T1</b> = 50 % (12 h) para renovar y <b>T2</b> = 87,5 % para intentar con cualquier servidor.</p>`, 'dhcp');
    if (cfg.probe) {
      const others = () => members().map(m => ({ id:m.id, i:m.i, ok:false, note:'no es mi IP: ignora' }));
      push(sim, { type:'tx', kind:'arp', tok:'ARP ?', lan:'L1', from:{ id:cid, i:0 }, to:others(), dstMac:BCAST, title:`ARP probe: «¿alguien usa ${offered}?»`,
        html:`<p>Antes de usar la IP, un cliente prudente comprueba con ARP que nadie más la tenga (RFC 5227). El <b>probe</b> usa <code>0.0.0.0</code> como IP emisor para no contaminar las cachés ajenas. Si alguien contestara, el cliente enviaría DHCPDECLINE.</p>`,
        layers:[eth(BCAST, mymac, ETYPE.arp), arpL({ oper:'1 (solicitud)', sha:mymac, spa:'0.0.0.0', tha:ZERO, tpa:offered })], mcq:mkMcq(W, BCAST, null, sim.steps.length) });

        html:`<p>Sin respuestas: la IP está libre. El cliente la anuncia con un <b>ARP gratuito</b> (IP emisor = IP objetivo) para que quienes tengan datos viejos sobre esa IP los actualicen.</p>`,

  },
  theory:`<p><b>DHCP</b> (RFC 2131) automatiza la configuración de los hosts: IP, máscara, gateway, DNS y un <b>tiempo de concesión</b> (<i>lease</i>). Evolucionó de BOOTP, que a diferencia de RARP funciona sobre UDP/IP y permite agentes de retransmisión.</p>
  <ul><li><b>Transporte:</b> UDP; servidor puerto 67, cliente 68. Va dentro de IP, pero el cliente aún no tiene dirección: usa origen <code>0.0.0.0</code> y destino <code>255.255.255.255</code>.</li>
  <li><b>Intercambio (DORA):</b> Discover (difusión) → Offer → Request (difusión, elige servidor) → Acknowledge. También existen NAK, Decline, Release e Inform.</li>
  <li><b>Relay agent:</b> el router escucha las difusiones, completa <b>giaddr</b> y las reenvía por unicast al servidor; éste elige el ámbito según giaddr. Así no hace falta un servidor por LAN (a diferencia de RARP).</li>
  <li><b>Concesión:</b> la dirección se presta por un tiempo. A T1 = 50 % el cliente renueva con su servidor; a T2 = 87,5 % intenta con cualquiera; si vence, debe abandonar la IP.</li>
  <li><b>Tipos de asignación:</b> manual (por MAC), automática y dinámica (con vencimiento).</li></ul>`
};

/* ---------- 5. ICMP ---------- */
function explainFail(sim, srcId, r) {
  const m = { ttl:['Time Exceeded', 'El TTL del datagrama se agotó en el camino. Es exactamente la señal que aprovecha <i>traceroute</i>.'],
    noroute:['Destination Unreachable (red)', 'El router no tiene ninguna ruta hacia la red destino y lo informa (tipo 3, código 0).'],
    arp:['Destination Unreachable (host)', 'El último router no pudo resolver la MAC del destino con ARP, y lo informa (tipo 3, código 1).'] }[r.reason];
  if (!m) return;
  if (r.err && r.err.delivered) think(sim, srcId, `${srcId} recibe ICMP ${m[0]}`, `<p>${m[1]} <b>${srcId}</b> recibe el mensaje ICMP, lee la cabecera IP original que viene incluida para saber a qué envío corresponde, e informa a la aplicación.</p>`, 'icmperr');
}
function ping(sim, srcId, dstIp, ttl, seq, quiet) {
  const sip = sim.W.nodes[srcId].ifs[0].ip;
  const req = { src:sip, dst:dstIp, ttl, proto:1, kind:'icmp', tok:'ICMP', name:'Echo Request', l4:() => icmpL(8, 0, [['Identificador / Secuencia', `1 / ${seq}`]]) };
  const r = sendIP(sim, srcId, req);
  if (r.delivered) {
    think(sim, r.node, `${r.node} recibe el Echo Request`, `<p>La capa IP ve protocolo 1 → ICMP. El tipo 8 pide una respuesta: devuelve el mismo contenido en un <b>Echo Reply</b> (tipo 0), intercambiando IP origen y destino. El Reply es un datagrama nuevo, con TTL propio.</p>`, 'icmp');
    const rep = { src:dstIp, dst:sip, ttl:64, proto:1, kind:'icmp', tok:'ICMP', name:'Echo Reply', l4:() => icmpL(0, 0, [['Identificador / Secuencia', `1 / ${seq}`]]) };
    const r2 = sendIP(sim, r.node, rep);
    if (r2.delivered) think(sim, srcId, `${srcId} recibe el Echo Reply`, `<p>El destino está vivo y alcanzable. La herramienta <i>ping</i> mide el tiempo entre el envío y esta respuesta (RTT).</p>`, 'icmp');
    return { ...r, replied:r2.delivered };
  }
  if (!quiet) explainFail(sim, srcId, r);
  return r;
}
SC.icmp = {
  label:'6. ICMP', title:'ICMP: ping, traceroute y mensajes de error',
  intro:'ICMP (RFC 792) permite a hosts y routers informar errores y hacer diagnóstico. Viaja <b>encapsulado en IP</b> (protocolo 1). Probá <i>ping</i>, <i>traceroute</i>, un TTL que expira, un host inexistente y una red sin ruta.',
  fields:[
    { id:'mode', label:'Herramienta', type:'select', opts:[['ping', 'ping (Echo Request / Reply)'], ['trace', 'traceroute (TTL creciente)']], def:'ping' },
    { id:'src', label:'Origen', type:'select', opts:hostOpts(ALLH), def:'A' },
    { id:'dst', label:'IP destino', type:'text', def:'172.16.0.20' },
    { id:'ttl', label:'TTL', type:'number', def:64, min:1, max:255, show:c => c.mode === 'ping' }
  ],
  presets:[ { label:'ping A → D', cfg:{ mode:'ping', src:'A', dst:'172.16.0.20', ttl:64 } }, { label:'traceroute A → D', cfg:{ mode:'trace', src:'A', dst:'172.16.0.20' } }, { label:'TTL = 2 (expira en R2)', cfg:{ mode:'ping', src:'A', dst:'172.16.0.20', ttl:2 } }, { label:'Host inexistente en LAN 3', cfg:{ mode:'ping', src:'A', dst:'172.16.0.99', ttl:64 } }, { label:'Red sin ruta (8.8.8.8)', cfg:{ mode:'ping', src:'A', dst:'8.8.8.8', ttl:64 } }, { label:'traceroute a un host inexistente', cfg:{ mode:'trace', src:'A', dst:'172.16.0.99' } } ],
  gen(sim, cfg) {
    if (!validIp(cfg.dst)) { think(sim, cfg.src, 'IP inválida', `<p>«${esc(cfg.dst)}» no es una dirección IPv4 válida.</p>`); return; }
    const sip = sim.W.nodes[cfg.src].ifs[0].ip;
    if (cfg.dst === sip) { think(sim, cfg.src, 'Destino igual al origen', '<p>Elegí otro destino.</p>'); return; }
    if (cfg.mode === 'ping') {
      think(sim, cfg.src, `ping ${cfg.dst} desde ${cfg.src}`, `<p>La herramienta <i>ping</i> arma un mensaje ICMP <b>Echo Request</b> (tipo 8) y lo entrega a IP con TTL inicial <b>${cfg.ttl}</b>. Para enviarlo hacen falta las mismas resoluciones ARP que para cualquier otro datagrama.</p>`, 'icmp');
      ping(sim, cfg.src, cfg.dst, Math.max(1, Math.min(255, +cfg.ttl || 64)), 1, false);
      return;
    }
    const hops = [];
    think(sim, cfg.src, `traceroute a ${cfg.dst}`, `<p><i>traceroute</i> descubre los routers del camino usando el TTL: envía sondas con TTL = 1, 2, 3… Cada router que decrementa el TTL a 0 descarta la sonda y contesta <b>ICMP Time Exceeded</b>, revelando su dirección. Cuando una sonda llega al destino, éste contesta con un Echo Reply.</p>`, 'icmp');
    for (let t = 1; t <= 8; t++) {
      think(sim, cfg.src, `Sonda ${t}: Echo Request con TTL = ${t}`, `<p>Se envía una nueva sonda con TTL <b>${t}</b>.</p>`, 'icmp');
      const r = ping(sim, cfg.src, cfg.dst, t, t, true);
      if (r.reason === 'ttl') { hops.push(`${t}. ${r.by} (${r.byIp})`); continue; }

      break;
    }
    think(sim, cfg.src, 'Resultado de traceroute', `<p>Ruta descubierta:</p><p class="calc mono">${hops.join('<br>') || '(sin saltos)'}</p>`, 'icmp');
  },
  theory:`<p><b>ICMP</b> es el protocolo con que routers y hosts informan sobre problemas y hacen pruebas. No vuelve confiable a IP: sólo reporta. Se encapsula en un datagrama IP con campo de protocolo = 1.</p>
  <ul><li><b>Destination unreachable (3):</b> código 0 red, 1 host, 3 puerto, 4 hace falta fragmentar y DF activado…</li>
  <li><b>Time exceeded (11):</b> el TTL llegó a 0 (código 0) o venció el tiempo de reensamblado.</li>
  <li><b>Echo request / reply (8 / 0):</b> base de <i>ping</i>.</li>
  <li><b>Redirect (5):</b> el router informa al host que existe un camino mejor. También <b>Parameter problem (12)</b>, <b>Timestamp (13/14)</b> y <b>Router advertisement/solicitation (9/10)</b>; <b>Source quench (4)</b> está en desuso.</li></ul>
  <p>Los mensajes de error incluyen la <b>cabecera IP original y los primeros 8 bytes</b> del datagrama culpable, para que el origen identifique la conexión afectada. Nunca se genera un ICMP de error en respuesta a otro ICMP de error, para evitar tormentas. Notá que cuando falla un ARP, el aviso que recibe el origen es ICMP: ARP resuelve direcciones <i>dentro</i> de una red; ICMP informa a lo largo del camino.</p>`
};

      n.ifs.forEach(f => { const left = f.side === 'l'; h += `<text class="if-label" x="${n.x + (left ? -30 : 30)}" y="${n.y + 28}" text-anchor="${left ? 'end' : 'start'}">${f.n} ${f.ip}</text>`; });
    }

}
function setBadge(id, text, cls) {
  const el = $('#bd-' + id); if (!el) return;
  el.setAttribute('class', 'badge ' + (cls || ''));
  while (el.firstChild) el.removeChild(el.firstChild);
  if (!text) return;
  const words = text.split(' '), lines = []; let cur = '';
  words.forEach(w => { if ((cur + ' ' + w).trim().length > 15 && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
  lines.push(cur);
  const x = el.getAttribute('x'), y0 = +el.getAttribute('y');
  lines.forEach((t, k) => { const ts = document.createElementNS(NSV, 'tspan'); ts.setAttribute('x', x); ts.setAttribute('y', y0 - 13 * (lines.length - 1 - k)); ts.textContent = t; el.appendChild(ts); });
}
function setNode(id, cls) { const g = $('#n-' + id); if (g) g.setAttribute('class', 'node ' + (cls || '')); }
function attachPts(id, lan) {
  const n = BASE.nodes[id];
  if (n.kind === 'host') return [{ x:n.x, y:n.y + 54 }, { x:n.x, y:BUS_Y }];
  const f = n.ifs.find(f => f.lan === lan);
  return [{ x:n.x + (f.side === 'l' ? -26 : 26), y:BUS_Y }];
}
function pathFor(from, to, lan) {
  const a = attachPts(from.id, lan), b = attachPts(to.id, lan).reverse();
  return [...a, ...b].filter((p, i, arr) => i === 0 || p.x !== arr[i - 1].x || p.y !== arr[i - 1].y);
}
function paintBase(st) {
  IDS.forEach(id => { setNode(id, ''); setBadge(id, ''); });
  Object.keys(LANS).forEach(k => $('#bus-' + k).setAttribute('class', 'bus'));
  $('#topo').style.setProperty('--kc', KCOL[st.kind] || KCOL.think);
  IDS.forEach(id => { const f = st.snap[id].ifs[0]; if (BASE.nodes[id].kind === 'host') $('#ip-' + id).textContent = f.ip ? f.ip : 'sin IP'; });
  if (st.type === 'tx') { $('#bus-' + st.lan).setAttribute('class', 'bus hot'); setNode(st.from.id, 'from'); setBadge(st.from.id, 'envía', 'from'); }
  else { setNode(st.at, 'think'); setBadge(st.at, 'analiza', 'think'); }
}
function paintEnd(st) {
  if (st.type !== 'tx') return;
  st.to.forEach(t => {
    const cls = t.ok === true ? 'ok' : t.ok === 'upd' ? 'upd' : 'no';
    if (t.id === st.from.id) return;
    setNode(t.id, cls); setBadge(t.id, t.note || (t.ok === true ? 'procesa' : 'descarta'), cls === 'upd' ? 'think' : cls);
  });
}
function animate(st) {
  cancelAnimationFrame(S.raf);
  const tk = $('#tokens'); tk.innerHTML = '';
  paintBase(st);
  if (st.type !== 'tx') return;
  const dur = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1100 / S.speed;
  if (!dur) { paintEnd(st); return; }
  const items = st.to.map(t => {
    const pts = pathFor(st.from, t, st.lan); let len = 0; const seg = [];
    for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); seg.push(d); len += d; }
    const g = document.createElementNS(NSV, 'g'); g.setAttribute('class', 'token');
    g.innerHTML = `<rect x="-24" y="-10" width="48" height="20" rx="6"/><text y="4">${st.tok || ''}</text>`;
    tk.appendChild(g); return { g, pts, seg, len };
  });
  const t0 = performance.now();
  const frame = now => {
    const p = Math.min(1, (now - t0) / dur), e = p < .5 ? 2 * p * p : 1 - 2 * (1 - p) * (1 - p);
    items.forEach(it => {
      let d = e * it.len, i = 0;
      while (i < it.seg.length - 1 && d > it.seg[i]) { d -= it.seg[i]; i++; }
      const a = it.pts[i], b = it.pts[i + 1] || a, f = it.seg[i] ? Math.min(1, d / it.seg[i]) : 1;
      it.g.setAttribute('transform', `translate(${a.x + (b.x - a.x) * f},${a.y + (b.y - a.y) * f})`);
    });
    if (p < 1) S.raf = requestAnimationFrame(frame); else { tk.innerHTML = ''; paintEnd(st); }
  };
  S.raf = requestAnimationFrame(frame);
}

/* ----- renderizado ----- */
function macOwner(mac) {

    if (st.layers) h += `<details class="hdr" data-k="hdr" ${S.open.hdr ? 'open' : ''}><summary>Ver cabeceras de la trama</summary>${st.layers.map(L => layerHtml(L, false)).join('')}</details>`;

}

function cacheCount() { return IDS.reduce((a, id) => a + Object.keys(PW.nodes[id].arp).length, 0); }

  if (!sim.steps.length) think(sim, 'A', 'Sin pasos', '<p>La configuración elegida no genera tráfico.</p>');
  if (!(sc.noCommit && sc.noCommit(cfg))) IDS.forEach(id => PW.nodes[id].arp = clone(W.nodes[id].arp));
  S.run = { steps:sim.steps, init:sim.init, W }; S.runId++;

}
