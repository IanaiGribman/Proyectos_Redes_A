<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parciales de Redes: examen en opción múltiple</title>
<style>
  :root {
    --bg:#fafafb; --surface:#fff; --text:#1f2430; --muted:#868d9c; --line:#ebedf2; --line-2:#dfe2ea;
    --accent:#3b5bdb; --accent-soft:#eef1fe; --ok:#16866f; --ok-soft:#f1faf7; --bad:#c0392b; --bad-soft:#fdf3f2; --warn:#a56a00; --warn-soft:#fff8e8;
    --radius:14px;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  code { font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:.88em; background:#f1f3f8; color:#2c3a8c; padding:1px 6px; border-radius:5px; }
  .muted { color:var(--muted); } .small { font-size:12.5px; }
  .wrap { max-width:860px; margin:0 auto; padding:0 24px; }
  .top { padding:34px 0 6px; }
  .top h1 { margin:0; font-size:clamp(22px,3vw,28px); font-weight:650; letter-spacing:-.03em; }
  .top p { margin:4px 0 0; color:var(--muted); }
  .back { display:inline-block; margin-bottom:10px; font-size:13px; font-weight:600; color:var(--muted); text-decoration:none; }
  .back:hover { color:var(--accent); }
  main.wrap { padding-bottom:80px; padding-top:22px; }
  h2 { font-size:20px; font-weight:650; margin:0 0 6px; letter-spacing:-.02em; }
  h3 { font-size:12px; margin:22px 0 8px; color:var(--muted); font-weight:650; text-transform:uppercase; letter-spacing:.06em; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; }
  .card + .card, .q + .q, .block { margin-top:16px; }
  .btn { border:1px solid transparent; border-radius:9px; padding:8px 16px; color:#fff; background:var(--accent); font-weight:600; transition:.15s; }
  .btn:hover { background:#2f49b8; }
  .btn.secondary { color:var(--text); background:#fff; border-color:var(--line-2); } .btn.secondary:hover { background:#f4f5f9; }
  .btn.warn { background:var(--warn); } .btn.warn:hover { background:#8a5700; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  input[type=checkbox], input[type=radio] { accent-color:var(--accent); }
  input:focus-visible, button:focus-visible, textarea:focus-visible { outline:3px solid rgba(59,91,219,.18); }
  /* selección de examen */
  .exlist { display:grid; gap:8px; margin-top:6px; }
  label.pick { display:flex; gap:12px; align-items:flex-start; border:1px solid var(--line-2); border-radius:11px; padding:11px 14px; cursor:pointer; transition:.12s; }
  label.pick:hover { background:#f6f7fb; }
  label.pick:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); }
  label.pick input { margin-top:5px; }
  label.pick b { font-weight:600; }
  label.line { display:flex; gap:10px; align-items:flex-start; padding:6px 0; font-size:14.5px; }
  label.line input { margin-top:5px; }
  details.quiet { border-top:1px solid var(--line); margin-top:22px; }
  details.quiet > summary { cursor:pointer; padding:14px 2px 4px; color:#4a5263; font-weight:600; font-size:14px; }
  textarea { width:100%; min-height:90px; border:1px solid var(--line-2); border-radius:9px; padding:9px 11px; font-family:ui-monospace,Consolas,monospace; font-size:12.5px; margin-top:8px; }
  /* barra fija */
  .bar { position:sticky; top:0; z-index:5; background:rgba(250,250,251,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); margin:0 -24px; padding:10px 24px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .bar .info { flex:1; min-width:180px; font-size:13px; color:var(--muted); }
  .bar .info b { color:var(--text); font-weight:650; }
  .pbar { height:4px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:5px; }
  .pbar i { display:block; height:100%; width:0; background:var(--accent); transition:width .25s; }
  .head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin:22px 0 4px; }
  .badge { display:inline-block; font-size:12px; font-weight:600; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:2px 10px; }
  /* preguntas */
  .sec { margin:30px 0 4px; font-size:12px; font-weight:650; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .q { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; }
  .qh { display:flex; justify-content:space-between; gap:10px; font-size:12.5px; font-weight:600; color:var(--muted); }
  .qh .pts { color:var(--accent); }
  .qe { margin:6px 0 12px; font-size:16px; line-height:1.55; font-weight:550; }
  .opts { display:grid; gap:7px; }
  label.opt { display:flex; gap:11px; align-items:flex-start; border:1px solid var(--line-2); border-radius:10px; padding:9px 13px; cursor:pointer; transition:.12s; font-size:14.5px; }
  label.opt:hover { background:#f6f7fb; }
  label.opt:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); }
  label.opt input { margin-top:5px; flex:none; }
  label.opt.ok { border-color:var(--ok); background:var(--ok-soft); }
  label.opt.miss { border-color:var(--ok); border-style:dashed; background:#fff; }
  label.opt.bad { border-color:var(--bad); background:var(--bad-soft); }
  label.opt.ok:has(input:checked) { border-color:var(--ok); background:var(--ok-soft); }
  label.opt.bad:has(input:checked) { border-color:var(--bad); background:var(--bad-soft); }
  label.ropt.ok:has(input:checked) { border-color:var(--ok); background:var(--ok-soft); }
  label.ropt.bad:has(input:checked) { border-color:var(--bad); background:var(--bad-soft); }
  label.opt input:disabled ~ span, label.ropt input:disabled ~ span { cursor:default; }
  .why { display:block; margin-top:3px; font-size:12.5px; color:var(--muted); }
  label.opt.ok .why { color:#14614f; } label.opt.bad .why { color:#8f2a20; }
  .field { margin-top:16px; }
  .fl { font-size:13.5px; font-weight:600; margin-bottom:7px; }
  .ropts { display:flex; flex-wrap:wrap; gap:7px; }
  label.ropt { display:inline-flex; gap:8px; align-items:center; border:1px solid var(--line-2); border-radius:9px; padding:6px 12px; cursor:pointer; font-family:ui-monospace,Consolas,monospace; font-size:13px; font-weight:550; transition:.12s; }
  label.ropt:hover { background:#f6f7fb; }
  label.ropt:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); }
  label.ropt.ok { border-color:var(--ok); background:var(--ok-soft); }
  label.ropt.bad { border-color:var(--bad); background:var(--bad-soft); }
  .foot { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:14px; }
  .sc { font-size:13px; font-weight:600; }
  .sc.full { color:var(--ok); } .sc.part { color:var(--warn); } .sc.zero { color:var(--bad); }
  .fb { margin-top:14px; padding:11px 14px; border-radius:10px; background:#f6f7fb; font-size:13.5px; }
  .big { font-size:54px; font-weight:650; letter-spacing:-.04em; line-height:1.1; margin:6px 0 2px; }
  .big small { font-size:18px; color:var(--muted); font-weight:500; margin-left:6px; letter-spacing:0; }
  .split { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-top:16px; }
  .split div { border:1px solid var(--line); border-radius:11px; padding:11px 14px; }
  .split b { display:block; font-size:20px; letter-spacing:-.02em; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
  .err { color:var(--bad); font-size:13.5px; margin:10px 0 0; }
  /* gráficos de switches */
  .gwrap { border:1px solid var(--line); border-radius:12px; background:#fcfcfd; padding:6px; margin:8px 0 10px; }
  .gsvg { width:100%; height:auto; display:block; }
  .gl { stroke:#cfd4df; stroke-width:3; stroke-linecap:round; fill:none; }
  .gl.hot { stroke:var(--accent); stroke-width:4.5; }
  .gn rect { fill:#fff; stroke:#8f98ac; stroke-width:2; }
  .gn text, .gh text { font-size:14px; font-weight:700; text-anchor:middle; fill:#1f2430; }
  .gn.hubn rect { fill:#fff8e8; stroke-dasharray:5 3; }
  .gn.flood rect, .gn.hub rect { stroke:#d98200; fill:#fff8e8; stroke-width:3; stroke-dasharray:none; }
  .gn.forward rect { stroke:var(--accent); fill:var(--accent-soft); stroke-width:3; }
  .gn.filter rect { stroke:var(--bad); fill:var(--bad-soft); stroke-width:3; }
  .gh rect { fill:#fff; stroke:#aab2c5; stroke-width:2; }
  .gh.tx rect { stroke:var(--accent); fill:var(--accent-soft); stroke-width:3; }
  .gh.rx rect { stroke:var(--ok); fill:var(--ok-soft); stroke-width:3; }
  .gp { font-size:11px; font-weight:650; fill:#6b7385; text-anchor:middle; }
  .gfr { font-size:13px; margin:6px 0 0; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; }
  .gf { background:#f1f3f8; border-radius:6px; padding:1px 8px; font-family:ui-monospace,Consolas,monospace; font-size:12.5px; }
  .gsim { margin-top:12px; padding:12px 14px; border:1px solid var(--line); border-radius:11px; background:#f9fafc; }
  .gsteps { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  button.gs { border:1px solid var(--line-2); background:#fff; border-radius:999px; padding:2px 12px; font-size:12.5px; font-weight:600; }
  button.gs.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .gtr { margin:10px 0 6px; font-size:13.5px; line-height:1.75; }
  .gt { font-size:13px; margin-top:4px; }
  .gt span { font-family:ui-monospace,Consolas,monospace; background:#fff; border:1px solid var(--line); border-radius:6px; padding:0 6px; margin-right:4px; }
  .gt span.new { background:#e8f7f1; border-color:var(--ok); }
  .qp { font-weight:600; margin:12px 0 8px; }
  @media (max-width:600px) { .bar { margin:0 -24px; } }
</style>
</head>

<script id="data" type="application/json">{"formato":{"descripcion":"Cada examen: t = teoria (10 preguntas MC, 5 pts c/u), p = practica (3 ejercicios con campos autocorregibles).","t":"[{e: enunciado, o: [[texto, correcta(1/0), justificacion], ...]}]","p":"[{titulo, e: enunciado, pts, c: [[etiqueta, respuesta, ...alternativas aceptadas]], j: justificacion}]","puntaje_mc":"5 * (correctas marcadas - incorrectas marcadas) / total_correctas, minimo 0","comparacion_campos":"ignorar mayusculas y espacios; aceptar cualquier alternativa listada"},"examenes":[{"id":"modelo-1","titulo":"Parcial modelo 1 - Enlace y red (edición «esto entra seguro»)","t":[{"e":"Respecto a un switch Ethernet (capa 2):","o":[["Aprende las MAC origen de las tramas que recibe",1,"Asocia la MAC origen al puerto de ingreso."],["Ante MAC destino desconocida, reenvia por todos los puertos menos el de ingreso",1,"Flooding de tramas con destino desconocido."],["Separa dominios de broadcast por defecto",0,"Solo las VLAN separan dominios de broadcast."],["Cada puerto es un dominio de colision separado",1,"Cada puerto es su propio dominio de colision."]]},{"e":"Respecto al acceso al medio y deteccion de errores:","o":[["CSMA/CD detecta colisiones mientras transmite",1,"Definicion de CSMA/CD."],["Tras una colision Ethernet usa backoff exponencial binario",1,"Espera aleatoria entre 0 y 2^n-1 ranuras."],["802.11 usa CSMA/CA porque no puede detectar colisiones mientras transmite",1,"Su propia senal tapa la ajena; se usan ACK."],["La paridad simple detecta cualquier cantidad de bits errados",0,"Solo detecta cantidad impar."]]},{"e":"Respecto al protocolo CSMA/CC (Carrier Sense Multiple Access con Chamuyo), que según un hilo viral de X reemplazó a CSMA/CD en todas las redes del Conurbano:","o":[["Cada estación escucha el medio y, si lo ve libre, transmite sin riesgo alguno de colisión: «tranqui, no pasa nada»",0,"Tremendamente falso. Siempre puede haber dos estaciones transmitiendo a la vez, y justamente de eso se trata: detectar o evitar la colisión. Decir «no pasa nada» es el clásico «pasó un colectivo y no lo vi»."],["Reemplazó a CSMA/CD en Ethernet de 10 Mbps por decreto de necesidad y urgencia",0,"Falso, falsísimo. CSMA/CD sigue siendo el método de Ethernet half duplex y ningún decreto lo movió de ahí."],["Es el método de acceso de 802.11, o sea, el WiFi del vecino",0,"El WiFi usa CSMA/CA (Collision Avoidance). El del vecino, encima, se llama «Familia_Gomez_5G» y no te lo comparte."],["Ninguna de las anteriores es verdadera (es obvio, hasta el kiosquero de la esquina lo sabe)",1,"Obvio: CSMA/CC no existe ni en el rincón más oscuro del datacenter; lo inventó un profesor a las 2 de la mañana con un fernet de por medio. Los verdaderos son CSMA/CD (Ethernet) y CSMA/CA (WiFi)."]]},{"e":"Respecto a las VLAN:","o":[["Cada VLAN es un dominio de broadcast distinto",1,"Correcto."],["Hosts de VLAN distintas en el mismo switch se comunican sin capa 3",0,"Hace falta router o switch L3."],["Un trunk transporta varias VLAN etiquetadas con 802.1Q",1,"Correcto."],["El VLAN ID de 802.1Q tiene 16 bits",0,"Tiene 12 bits."]]},{"e":"Respecto a Spanning Tree Protocol (STP):","o":[["Evita lazos de capa 2 en topologias redundantes",1,"Es su objetivo."],["Elige como raiz al switch con menor Bridge ID",1,"Prioridad + MAC."],["Los puertos bloqueados descartan las BPDU",0,"Los puertos bloqueados si reciben BPDU."],["Opera en capa 3 y usa TTL",0,"Opera en capa 2; las tramas no tienen TTL."]]},{"e":"Respecto a ARP:","o":[["La ARP Request va por broadcast de capa 2",1,"Destino ff:ff:ff:ff:ff:ff."],["La ARP Reply va por broadcast",0,"Es unicast."],["ARP se encapsula en IP",0,"Va directo sobre Ethernet (0x0806)."],["Si el destino esta fuera de la subred, se hace ARP de la IP del gateway",1,"Se resuelve la MAC del gateway."]]},{"e":"Observá la red: S1 es un switch y H1 es un hub, un dispositivo de otra época, como el Winamp. Las tablas MAC de S1 arrancan vacías y se envían las tramas indicadas, en orden.","g":{"sw":[{"id":"S1","h":[["A",1],["B",2]],"up":[["H1",3,1]]},{"id":"H1","tipo":"hub","h":[["C",2],["D",3]]}],"tramas":[["C","D"],["A","C"],["B","?"]]},"ask":{"k":"hosts","n":2}},{"e":"Respecto a IPv4:","o":[["El reensamblado de fragmentos lo hace el host destino",1,"Es extremo a extremo."],["Cada router decrementa el TTL",1,"Evita bucles infinitos."],["Fragment Offset se mide en unidades de 8 bytes",1,"Correcto."],["Los routers intermedios reensamblan antes de reenviar",0,"Solo fragmentan."]]},{"e":"Respecto a IPv6:","o":[["Las direcciones tienen 128 bits",1,"Correcto."],["Los routers intermedios pueden fragmentar",0,"Solo el origen fragmenta."],["No hay broadcast; se usa multicast",1,"Correcto."],["Usa ARP para resolver MAC",0,"Usa NDP (ICMPv6)."]]},{"e":"Respecto a DHCP:","o":[["Proceso Discover, Offer, Request, Ack",1,"DORA."],["El Discover se envia por broadcast",1,"El cliente aun no tiene IP."],["Usa TCP puertos 67 y 68",0,"Usa UDP."],["El servidor debe estar siempre en la misma subred",0,"Puede usarse un relay."]]},{"e":"Respecto a IPv5:","o":[["Existió como protocolo experimental (Internet Stream Protocol, ST) y nunca se desplegó masivamente",1,"Correcto: el número 5 ya estaba asignado a ST, y por eso el sucesor de IPv4 es IPv6."],["Se lo saltearon porque el 5 es el colectivo que nunca pasa",0,"Chiste hermoso, explicación falsa: la versión 5 ya se había asignado a ST."],["Usa direcciones de 64 bits y fue la base de IPv6",0,"Tremendamente falso: ni usa 64 bits ni fue la base de IPv6."],["Ninguna de las anteriores es verdadera (obvio, ¿qué más va a ser?)",0,"Falso, falsísimo: la primera es verdadera. Caíste en la trampa como turista en la 9 de Julio."]]},{"e":"Respecto a ICMP:","o":[["Sus mensajes viajan encapsulados en IP",1,"Protocolo IP 1."],["traceroute usa los mensajes Time Exceeded",1,"TTL creciente."],["Es de capa 4 y usa puertos",0,"No usa puertos."],["ping usa Echo Request y Echo Reply",1,"Correcto."]]},{"e":"Respecto al ruteo:","o":[["RIP es de vector distancia con metrica en saltos",1,"Correcto."],["OSPF es de estado de enlace",1,"Correcto."],["BGP es de estado de enlace para uso dentro de un AS",0,"BGP es path vector entre ASes."],["En RIP, 16 saltos es infinito",1,"Maximo util 15."]]}],"p":[{"titulo":"Subnetting / VLSM","pts":15,"e":"Bloque 192.168.10.0/24. Subredes (VLSM, de mayor a menor): A 100 hosts, B 50 hosts, C 25 hosts, enlace punto a punto. Indicar red (CIDR) y broadcast de cada una.","c":[["Red A","192.168.10.0/25"],["Broadcast A","192.168.10.127"],["Red B","192.168.10.128/26"],["Broadcast B","192.168.10.191"],["Red C","192.168.10.192/27"],["Broadcast C","192.168.10.223"],["Red enlace","192.168.10.224/30"],["Broadcast enlace","192.168.10.227"]],"j":"100 hosts -> 7 bits (/25); 50 -> 6 bits (/26); 25 -> 5 bits (/27); 2 -> 2 bits (/30). Se asigna de mayor a menor para mantener la alineacion."},{"titulo":"Tablas de ruteo","pts":20,"e":"R1 (eth0 10.0.1.1/24, eth1 10.0.12.1/30) - R2 (eth0 10.0.12.2/30, eth1 10.0.2.1/24, eth2 10.0.23.1/30) - R3 (eth0 10.0.23.2/30, eth1 10.0.3.1/24). a) Next hop en R2 para 10.0.1.0/24. b) Next hop del default de R1. c) Next hop de R2 para 10.0.3.77. d) Se agrega en R2 la ruta 10.0.3.64/26 via 10.0.12.1: nuevo next hop para 10.0.3.77 y fenomeno que ocurre.","c":[["a) Next hop R2 a 10.0.1.0/24","10.0.12.1"],["b) Default de R1","10.0.12.2"],["c) Next hop R2 a 10.0.3.77","10.0.23.2"],["d) Nuevo next hop","10.0.12.1"],["d) Fenomeno","bucle de ruteo","bucle","loop","routing loop"]],"j":"El /26 (10.0.3.64-127) incluye .77 y es mas especifico que el /24 (longest prefix match). R1 devuelve el paquete a R2 por su default: bucle hasta que el TTL llega a 0."},{"titulo":"Switch, ARP y NAT","pts":15,"e":"LAN 192.168.1.0/24: S1 con A (p1), B (p2), C (p3), Router R (p4, NAT overload, IP publica 200.1.1.1). Tablas vacias. a) MAC destino del ARP Request de A. b) Puertos por los que S1 inunda ese Request (separados por coma). c) Tras el ARP Reply de B, puerto en el que S1 reenvia el Reply. d) A abre TCP desde el puerto 5000 a 93.184.216.34:80: MAC destino de la trama que sale de A (escribir MAC R). e) Origen (IP:puerto) del paquete que sale a Internet si R asigna el puerto 40001.","c":[["a) MAC destino","ff:ff:ff:ff:ff:ff"],["b) Puertos de flooding","2,3,4"],["c) Puerto del Reply","1"],["d) MAC destino","MAC R"],["e) Origen saliente","200.1.1.1:40001"]],"j":"El Request es broadcast y se inunda por todos menos el de ingreso. El Reply es unicast hacia A (puerto 1). Destino externo: se usa la MAC del gateway y la IP final no cambia. PAT traduce IP y puerto origen.","g":{"sw":[{"id":"S1","h":[["A",1],["B",2],["C",3],["R",4]]}],"tramas":[["A","ff"],["B","A"]]}}]},{"id":"modelo-2","titulo":"Parcial modelo 2 - Enlace y red (edición «lo vimos en clase»)","t":[{"e":"Respecto a la trama Ethernet:","o":[["Las direcciones MAC tienen 48 bits",1,"Correcto."],["Incluye un FCS con CRC-32",1,"Para detectar errores."],["Payload tipico de hasta 1500 bytes (MTU)",1,"MTU estandar de Ethernet."],["Incluye un campo TTL",0,"El TTL es de IP, no de Ethernet."]]},{"e":"Respecto al funcionamiento de un switch:","o":[["Store-and-forward verifica el FCS antes de reenviar",1,"Recibe la trama completa."],["Cut-through puede reenviar tras leer la MAC destino",1,"Menor latencia, sin verificar FCS completo."],["Las entradas de la tabla MAC tienen tiempo de expiracion (aging)",1,"Evita entradas obsoletas."],["Un hub aprende MAC",0,"Un hub solo repite la senal."]]},{"e":"Respecto a la sigla MTU:","o":[["Significa Maximum Transmission Unit",1,"Es el tamaño máximo de la carga útil que puede transportar la trama del enlace."],["En Ethernet típico vale 1500 bytes",1,"Es el valor clásico del payload de Ethernet II."],["Significa «Mate Tibio Urgente» y se pide a los gritos cuando hay quilombo en el datacenter",0,"Se agradece el aporte yerbatero, pero no: es Maximum Transmission Unit. Y el mate tibio sigue siendo una injusticia universal."],["Se negocia entre hosts con el protocolo MTUX (MTU eXpress, ahora también en historias de Instagram)",0,"MTUX no existe, ni siquiera en las historias destacadas. Lo que sí existe es Path MTU Discovery (ICMP y el bit DF)."]]},{"e":"Hubs, switches y routers:","o":[["Un hub forma un unico dominio de colision",1,"Repite por todos los puertos."],["Un router separa dominios de broadcast",1,"No reenvia broadcast."],["Un switch comun opera en capa 3",0,"Opera en capa 2."],["Un router reescribe MAC origen/destino al reenviar",1,"Cada salto cambia la MAC; la IP no."]]},{"e":"Deteccion y correccion de errores:","o":[["CRC detecta rafagas de errores de longitud menor o igual al grado del polinomio",1,"Propiedad de CRC."],["El checksum de Internet es suma en complemento a uno de 16 bits",1,"Correcto."],["Hamming permite corregir errores de 1 bit",1,"Distancia minima 3."],["CRC siempre permite corregir el error",0,"CRC solo detecta."]]},{"e":"Respecto a 802.11 (WiFi):","o":[["Usa ACK a nivel de enlace",1,"Confirma cada trama unicast."],["RTS/CTS ayuda con el nodo oculto",1,"Reserva el medio."],["Una trama puede tener hasta 4 direcciones MAC",1,"Por ejemplo en modo WDS."],["Usa CSMA/CD",0,"Usa CSMA/CA."]]},{"e":"Tres switches en línea, como la cola del banco un viernes a las 10. Todas las tablas MAC arrancan vacías y se envían las tramas indicadas, en orden.","g":{"sw":[{"id":"S1","h":[["A",1],["B",2]],"up":[["S2",3,1]]},{"id":"S2","h":[["C",2]],"up":[["S3",3,1]]},{"id":"S3","h":[["D",2],["E",3]]}],"tramas":[["A","E"],["E","A"],["B","C"]]},"ask":{"k":"tabla","sw":"S2","n":2}},{"e":"Direccionamiento IPv4:","o":[["10.0.0.0/8 es privada",1,"RFC 1918."],["172.20.5.1 es privada",1,"172.16.0.0/12 cubre 172.16-172.31."],["192.168.0.0/16 es publica",0,"Es privada."],["127.0.0.1 es loopback",1,"Correcto."]]},{"e":"Subnetting:","o":[["Un /26 tiene 62 hosts utilizables",1,"2^6 - 2."],["Un /30 tiene 4 hosts utilizables",0,"Tiene 2."],["La mascara /20 es 255.255.240.0",1,"Tercer octeto 240."],["192.168.1.130/25 pertenece a la red 192.168.1.128",1,"Bloques de 128."]]},{"e":"Respecto a NAT:","o":[["PAT permite compartir una IP publica usando puertos",1,"Correcto."],["NAT dificulta conexiones entrantes",1,"Rompe el modelo extremo a extremo."],["NAT requiere una tabla de traducciones",1,"Mantiene estado."],["NAT es imprescindible en IPv6",0,"IPv6 tiene espacio suficiente."]]},{"e":"Respecto al modelo de capas (OSI y TCP/IP):","o":[["La capa de transporte es la capa 4 del modelo OSI",1,"Correcto."],["OSI define oficialmente la capa 8 (Usuario) y la capa 9 (el Jefe que dice «es para ayer»)",0,"Folklore puro: OSI tiene 7 capas. La 8 y la 9 existen sólo en los chistes de sysadmin y en las oficinas, que es peor."],["ARP anda de chusma entre la capa 2 y la 3, por eso es la capa 8",0,"Se lo suele ubicar entre enlace y red (la cátedra le dice «capa 2,5» con cariño), pero OSI no tiene capa 8."],["Ninguna de las anteriores es verdadera (es obvio, ni hace falta leer)",0,"Tremendamente falso: la primera era verdadera. Trampita clásica de parcial; leer sí hace falta, y mucho."]]},{"e":"Respecto a ICMP:","o":[["Un router que descarta por TTL=0 envia Time Exceeded",1,"Correcto."],["Fragmentation Needed se usa en Path MTU Discovery",1,"Con DF=1."],["ICMP vuelve a IP confiable",0,"No garantiza entrega."],["Destination Unreachable puede indicar red, host o puerto inalcanzable",1,"Distintos codigos."]]},{"e":"Respecto al ruteo:","o":[["Se elige la ruta de prefijo mas largo (longest prefix match)",1,"Correcto."],["La ruta 0.0.0.0/0 se usa solo si ninguna mas especifica coincide",1,"Es la menos especifica."],["OSPF usa areas y el area 0 es el backbone",1,"Correcto."],["RIP converge mas rapido que OSPF",0,"Suele converger mas lento."]]}],"p":[{"titulo":"Subnetting con una IP","pts":15,"e":"Dada la direccion 172.16.45.200/20 calcular: mascara, direccion de red, broadcast, primera y ultima IP utilizables y cantidad de hosts.","c":[["Mascara","255.255.240.0"],["Red","172.16.32.0"],["Broadcast","172.16.47.255"],["Primera utilizable","172.16.32.1"],["Ultima utilizable","172.16.47.254"],["Hosts","4094"]],"j":"/20 -> bloques de 16 en el tercer octeto; 45 cae en 32-47. Hosts = 2^12 - 2 = 4094."},{"titulo":"Agregacion y longest prefix match","pts":20,"e":"a) Resumir 10.1.0.0/24, 10.1.1.0/24, 10.1.2.0/24 y 10.1.3.0/24 en una sola ruta. Tabla de un router: 10.1.0.0/22 via A; 10.1.2.0/24 via B; 0.0.0.0/0 via C. b) Next hop para 10.1.2.50. c) Next hop para 10.1.3.9. d) Next hop para 10.2.0.1.","c":[["a) Ruta resumida","10.1.0.0/22"],["b) 10.1.2.50","B"],["c) 10.1.3.9","A"],["d) 10.2.0.1","C"]],"j":"Los cuatro /24 consecutivos forman un /22. 10.1.2.50 coincide con /22 y /24; gana el /24 (B). 10.1.3.9 solo coincide con el /22 (A). 10.2.0.1 solo con el default (C)."},{"titulo":"RIP","pts":15,"e":"La red N1 esta conectada a R1; R1-R2-R3 en linea. Con RIP (red conectada = 0 saltos) y la red convergida: a) costo de R3 hacia N1; b) next hop de R3 hacia N1; c) si falla N1, que problema puede aparecer; d) valor que RIP considera infinito.","c":[["a) Costo de R3","2"],["b) Next hop de R3","R2"],["c) Problema","cuenta a infinito","count to infinity","conteo a infinito"],["d) Infinito","16"]],"j":"R1 0, R2 1, R3 2. Sin mecanismos como split horizon/poison reverse, R2 y R3 se anuncian rutas viejas mutuamente incrementando la metrica (cuenta a infinito) hasta 16."}]},{"id":"modelo-3","titulo":"Parcial modelo 3 - Enlace y red (edición «con el apunte alcanza»)","t":[{"e":"Respecto a STP:","o":[["El root port es el de menor costo hacia la raiz",1,"Correcto."],["Todos los puertos del root bridge son designados",1,"Correcto."],["La raiz se elige por menor MAC ignorando la prioridad",0,"Se compara prioridad y luego MAC."],["En STP clasico hay un unico root bridge por dominio de capa 2",1,"Correcto."]]},{"e":"Ethernet full duplex:","o":[["No hay colisiones en un enlace punto a punto full duplex",1,"Canales separados."],["CSMA/CD se desactiva",1,"No hace falta."],["Requiere hubs",0,"Se usa con switches o enlaces directos."],["Permite transmitir y recibir simultaneamente",1,"Correcto."]]},{"e":"Sobre las BPDU-Z (Bridge Protocol Data Unit Zarpada), que según un TikTok de un ingeniero muy seguro de sí mismo reemplazan a las BPDU de STP:","o":[["Los puertos bloqueados las envían para ponerse a ver Netflix mientras esperan",0,"Los puertos bloqueados no transmiten BPDU de configuración y mucho menos maratonean series."],["Se usan para elegir el root bridge por votación en un hilo de X",0,"El root bridge se elige por menor Bridge ID (prioridad + MAC), sin likes ni retuits."],["Viajan encapsuladas en IP con TTL 3, como el colectivo que pasa cada tres horas",0,"Las BPDU de STP son de capa 2 y no usan IP: no tienen TTL ni, por suerte, frecuencia de colectivo."],["Ninguna de las anteriores es verdadera (tremendamente falso todo, de punta a punta)",1,"Obvio: las BPDU-Z no existen, nacieron en una servilleta de un bar de Palermo. Las BPDU reales llevan el Bridge ID de la raíz y el costo hacia ella."]]},{"e":"Direcciones MAC:","o":[["ff:ff:ff:ff:ff:ff es broadcast",1,"Correcto."],["Se usan para rutear entre redes",0,"El ruteo usa IP."],["Un bit menos significativo del primer byte en 1 indica grupo (multicast)",1,"Correcto."],["Cambian en cada salto de router",1,"Las reescribe cada router."]]},{"e":"VLAN, trunks y routing:","o":[["Las tramas de la VLAN nativa van sin etiqueta en 802.1Q",1,"Correcto."],["Un puerto de acceso pertenece a una sola VLAN",1,"Correcto."],["Un puerto de acceso agrega etiqueta 802.1Q hacia el host",0,"El host recibe tramas sin etiqueta."],["Router-on-a-stick usa subinterfaces",1,"Una por VLAN."]]},{"e":"Respecto a ARP:","o":[["El ARP gratuito anuncia la propia IP/MAC",1,"Correcto."],["Las entradas de la cache ARP expiran",1,"Correcto."],["El ARP spoofing permite suplantar a otro host",1,"No hay autenticacion."],["ARP autentica las respuestas",0,"No lo hace."]]},{"e":"Dos switches con las tablas MAC tan vacías como la heladera a fin de mes. Se envían las tramas indicadas, en orden.","g":{"sw":[{"id":"S1","h":[["A",1],["B",2]],"up":[["S2",3,1]]},{"id":"S2","h":[["C",2],["D",3]]}],"tramas":[["A","C"],["C","A"],["A","D"],["B","ff"]]},"ask":{"k":"inunda","sw":"S2"}},{"e":"Direccionamiento IPv6:","o":[["::1 es loopback",1,"Correcto."],["fe80::/10 es link-local",1,"Correcto."],["El header IPv6 tiene checksum",0,"Fue eliminado."],["La cabecera base tiene 40 bytes fijos",1,"Correcto."]]},{"e":"Neighbor Discovery (NDP):","o":[["Neighbor Solicitation reemplaza al ARP Request",1,"Correcto."],["Se envia a la direccion multicast solicited-node",1,"Correcto."],["Router Advertisement permite SLAAC",1,"Correcto."],["NDP usa UDP",0,"Usa ICMPv6."]]},{"e":"Respecto a DHCP:","o":[["El cliente intenta renovar al 50% del lease",1,"Tiempo T1."],["Puede entregar gateway y DNS",1,"Opciones DHCP."],["Sin respuesta, un cliente Windows puede autoasignarse 169.254.x.x",1,"APIPA."],["DHCP solo funciona en IPv6",0,"DHCPv4 existe."]]},{"e":"Sobre la dirección MAC CA:FE:CA:FE:CA:FE:","o":[["Es una dirección unicast, porque el bit menos significativo del primer byte es 0",1,"0xCA = 1100 1010: el bit I/G vale 0, así que es unicast."],["Tiene el bit U/L en 1: es una dirección administrada localmente",1,"El segundo bit menos significativo del primer byte (0xCA = 1100 1010) es 1."],["Es una dirección de difusión (broadcast), porque el cafecito siempre se comparte",0,"Dulce idea, pero el broadcast es FF:FF:FF:FF:FF:FF."],["Pertenece al fabricante «Cafecito Eléctrico del Conurbano S.R.L.», con OUI registrado ante la IEEE",0,"Con el bit U/L en 1 no tiene OUI de fabricante. La cafetera es inventada, pero el cafecito de las 4 es real y merecido."]]},{"e":"Un paquete IPv4 de 4020 bytes (20 de header) debe atravesar un enlace con MTU 1500:","o":[["Se generan 3 fragmentos",1,"Datos 4000 = 1480+1480+1040."],["El ultimo fragmento lleva 1040 bytes de datos",1,"Resto."],["El segundo fragmento tiene offset 185",1,"1480/8."],["El primer fragmento tiene MF=0",0,"MF=1 en todos menos el ultimo."]]},{"e":"OSPF y BGP:","o":[["BGP usa TCP puerto 179",1,"Correcto."],["OSPF usa el multicast 224.0.0.5",1,"AllSPFRouters."],["OSPF elige un DR en redes broadcast",1,"Correcto."],["BGP elige siempre el camino de menos saltos fisicos",0,"Usa atributos y politicas."]]}],"p":[{"titulo":"Fragmentacion IPv4","pts":20,"e":"Datagrama de 4020 bytes totales (20 header + 4000 datos), MTU 1500. Indicar: cantidad de fragmentos, offset del 2do, offset del 3ro, bytes de datos del 3ro, total length del 3ro.","c":[["Cantidad de fragmentos","3"],["Offset 2do","185"],["Offset 3ro","370"],["Datos 3ro","1040"],["Total length 3ro","1060"]],"j":"Datos max por fragmento = 1480 (multiplo de 8). 4000 = 1480+1480+1040. Offsets 0, 185, 370. Total length ultimo = 1040+20 = 1060."},{"titulo":"Aprendizaje de switches","pts":15,"e":"S1: p1 A, p2 B, p3 uplink a S2. S2: p1 uplink a S1, p2 C, p3 D. Tablas vacias. A hace ARP de C y C responde. a) Puerto de A en la tabla de S2. b) Puerto de C en la tabla de S1. c) Puerto de C en la tabla de S2. d) Recibe D el ARP Request (si/no). e) Recibe B el ARP Reply (si/no).","c":[["a) A en S2","1"],["b) C en S1","3"],["c) C en S2","2"],["d) D recibe Request","si","sí"],["e) B recibe Reply","no"]],"j":"El Request se inunda en ambos switches (D y B lo reciben). El Reply es unicast hacia A, ya conocida en S2 (p1) y S1 (p1), asi que B no lo recibe.","g":{"sw":[{"id":"S1","h":[["A",1],["B",2]],"up":[["S2",3,1]]},{"id":"S2","h":[["C",2],["D",3]]}],"tramas":[["A","ff"],["C","A"]]}},{"titulo":"Subredes iguales e IPv6","pts":15,"e":"Dividir 10.10.0.0/22 en 4 subredes iguales. a) Prefijo de cada una. b) Broadcast de la tercera. c) Primera IP utilizable de la cuarta. d) Hosts utilizables por subred. e) Abreviar 2001:0db8:0000:0000:0000:0000:0000:0001.","c":[["a) Prefijo","/24"],["b) Broadcast 3ra","10.10.2.255"],["c) Primera 4ta","10.10.3.1"],["d) Hosts","254"],["e) IPv6","2001:db8::1"]],"j":"/22 -> /24 (2 bits mas). Subredes: 10.10.0.0, 10.10.1.0, 10.10.2.0, 10.10.3.0 const ip2n = ip => ip.split('.').reduce((a, b) => a * 256 + (+b), 0);

  'modelo-2|2|1':['R1', 'R3', 'Conectada directamente'],

  if (isIp(a)) {
    const o = a.split('.').map(Number), mk = (idx, d) => { const v = o[idx] + d; if (v < 0 || v > 255) return null; const c = o.slice(); c[idx] = v; return c.join('.'); };
    const near = [mk(3, 1), mk(3, -1)].filter(Boolean), far = [mk(2, 1), mk(2, -1), mk(3, 2), mk(3, -2), mk(3, 64), mk(3, -64), mk(3, 32), mk(3, -32)].filter(Boolean);
    return [...shuffle([...poolIps.slice(0, 2), ...near]), ...far];
  }
  if (/^\/\d+$/.test(a)) { const p = +a.slice(1); return [p - 2, p - 1, p + 1, p + 2, p + 3, p - 3].filter(q => q >= 1 && q <= 32).map(q => '/' + q); }

    const cur = new Set(a.split(',')), all = []; for (let m = 1; m < 16; m++) { const s = [1, 2, 3, 4].filter(i => m & (1 << (i - 1))).map(String); all.push(s); }
    return shuffle(all.map(s => [s.join(','), s.filter(x => !cur.has(x)).length + [...cur].filter(x => !s.includes(x)).length])).sort((x, y) => x[1] - y[1]).map(x => x[0]);
  }

    let c;

const SPEC = `Generá un archivo JSON con exámenes de parcial para un simulador de exámenes en opción múltiple. Respondé únicamente con el JSON válido (sin comentarios ni texto adicional).

- Puede haber varias correctas (lo típico: 2 o 3 de 4) y siempre al menos una.
- Puntaje de la pregunta: puntos de la pregunta × (correctas marcadas − incorrectas marcadas) / total de correctas, con mínimo 0.
- Podés incluir la opción «Ninguna de las anteriores es verdadera» (1 sólo si las otras son realmente falsas; si alguna es verdadera, ponela en 0 y aclaralo en la justificación).

- Cada ítem de "c" es [etiqueta, respuesta correcta, ...alternativas equivalentes opcionales] y la página lo convierte en una pregunta de opción múltiple con una sola correcta. Los puntos del ejercicio se reparten en partes iguales entre sus ítems.

GRÁFICOS DE SWITCHES (opcional): aprendizaje de MAC y reenvío de tramas
Cualquier pregunta de teoría o ejercicio práctico puede llevar un diagrama con la clave "g". La página simula la red, dibuja el diagrama y, una vez corregido, muestra la simulación trama por trama (enlaces usados, hosts que la reciben, tablas MAC).

REGLAS
- JSON válido en UTF-8: comillas dobles, sin comas finales. Se permiten tildes y ñ.
- Salvo que se indique otra cosa: unas 10 a 14 preguntas de teoría y 3 ejercicios prácticos por examen, con 100 puntos en total (teoría 50 + práctica 50, por ejemplo 15 + 20 + 15).
- Evitá preguntas ambiguas: una opción sólo es correcta si es incuestionablemente verdadera.

function barHtml() {
  const g = progress(), fin = X.finished;
  return `<div class="bar" id="bar"><div class="info"><b>${g.done}</b> de ${g.total} ítems respondidos${S.mode === 'respuesta' && g.okMax ? ` · corregido: <b>${fmt(g.ok)}</b> / ${g.okMax} pts` : ''}<div class="pbar"><i style="width:${g.done / g.total * 100}%"></i></div></div>
    ${fin ? '' : `<button class="btn ${X.confirm ? 'warn' : ''}" data-act="finish">${X.confirm ? `Faltan ${g.total - g.done}: finalizar igual` : 'Finalizar y corregir'}</button>`}</div>`;
}
function resultHtml() {
  const t = totals(), nota = (t.all / t.max * 10).toFixed(1).replace('.', ',');
  return `<div class="card block" id="result"><h2>Resultado · ${esc(X.ex.titulo)}</h2><div class="big">${fmt(t.all)}<small>/ ${t.max} pts</small></div>
    <p class="muted" style="margin:0">Nota equivalente: <b>${nota}</b> sobre 10 (${Math.round(t.all / t.max * 100)} %)</p>
    <div class="split"><div><span class="muted small">Teoría</span><b>${fmt(t.t)} / ${t.tm}</b></div><div><span class="muted small">Práctica</span><b>${fmt(t.p)} / ${t.pm}</b></div></div>
    <div class="actions"><button class="btn" data-act="retry">Reintentar este examen</button><button class="btn secondary" data-act="menu">Elegir otro examen</button></div>
    <p class="muted small" style="margin:14px 0 0">Abajo podés revisar cada pregunta con su justificación.</p></div>`;
}
function renderExam() {
  $('#app').innerHTML = `<div class="head"><div><h2 style="margin:0">${esc(X.ex.titulo)}</h2><span class="badge">${S.mode === 'respuesta' ? 'Corrección al responder' : 'Corrección al final'}</span></div>${X.finished ? '' : '<button class="btn secondary" data-act="menu">Salir</button>'}</div>
    ${X.finished ? resultHtml() : ''}${barHtml()}
    <div class="sec">Teoría</div>${X.t.map((_, i) => tCard(i)).join('')}
    <div class="sec">Práctica</div>${X.p.map((_, i) => pCard(i)).join('')}`;
}
const refreshBar = () => { const b = $('#bar'); if (b) b.outerHTML = barHtml(); };
const replaceCard = id => { const el = $('#' + id); if (!el) return; el.outerHTML = id[0] === 't' ? tCard(+id.slice(1)) : pCard(+id.slice(1)); };

/* ===== acciones ===== */
function start(id) {
  const ex = DATA.examenes.find(e => e.id === id), mix = S.shuffle ? shuffle : a => a;
  const withSim = (o, g, ask) => {                // gráfico: simula la red y, si hay "ask", genera las opciones
    if (!g) return o;
    try { o.sim = simSwitch(g); o.gstep = ask ? Math.max(0, Math.min((+ask.n || o.sim.frames.length) , o.sim.frames.length) - 1) : 0; if (ask) { const a = buildAsk(o.sim, ask); o.prompt = a.prompt; o.opts = mix(a.opts); } }
    catch (err) { o.gerr = err.message; o.opts = o.opts || []; }
    return o;
  };
  X = { ex, finished:false, confirm:false, pt:ptsT(ex) / ex.t.length,
    t:ex.t.map(q => withSim({ q, g:q.g, opts:q.ask ? [] : mix((q.o || []).map(([t, c, j]) => ({ t, c:!!c, j }))), sel:new Set(), checked:false }, q.g, q.ask)),
    p:ex.p.map((p, pi) => { const pool = [...new Set(p.c.map(f => f[1]))]; return withSim({ p, checked:false, gstep:0, fields:p.c.map((_, ci) => buildField(ex, pi, ci, pool.filter(x => x !== p.c[ci][1]))) }, p.g, null); }) };
  render(); window.scrollTo(0, 0);
}
function loadJson(text) {
  try { DATA = normalizeData(JSON.parse(text)); S.sel = DATA.examenes[0].id; S.error = ''; }
  catch (e) { S.error = 'No se pudo cargar el JSON: ' + e.message; }
  renderSetup();
}
document.addEventListener('change', e => {
  const t = e.target;
  if (!X) {
    if (t.name === 'ex') S.sel = t.value; else if (t.name === 'mode') S.mode = t.value; else if (t.id === 'o-shuf') S.shuffle = t.checked;
    else if (t.id === 'o-file' && t.files[0]) { const r = new FileReader(); r.onload = () => loadJson(r.result); r.readAsText(t.files[0]); }
    return;
  }
  X.confirm = false;
  if (t.dataset.t != null) { const T = X.t[+t.dataset.t]; t.checked ? T.sel.add(+t.dataset.o) : T.sel.delete(+t.dataset.o); }
  else if (t.dataset.p != null) { X.p[+t.dataset.p].fields[+t.dataset.f].sel = +t.dataset.o; }
  refreshBar();
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'start') start(S.sel);
  else if (act === 'copy') {
    const done = ok => { const m = $('#o-copied'); if (m) m.textContent = ok ? 'Copiado ✔' : 'No se pudo copiar: seleccioná el texto y copialo a mano'; };
    const fallback = () => { const ta = $('#o-spec'); ta.focus(); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} done(ok); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(SPEC).then(() => done(true), fallback); else fallback();
  }
  else if (act === 'load') { const v = $('#o-text').value.trim(); if (v) loadJson(v); }
  else if (act === 'gs') { const k = b.dataset.k, u = k[0] === 't' ? X.t[+k.slice(1)] : X.p[+k.slice(1)]; u.gstep = +b.dataset.s; replaceCard(k); }
  else if (act === 'ct') { X.t[i].checked = true; replaceCard('t' + i); refreshBar(); }
  else if (act === 'cp') { X.p[i].checked = true; replaceCard('p' + i); refreshBar(); }
  else if (act === 'finish') {
    const g = progress();
    if (g.done < g.total && !X.confirm) { X.confirm = true; refreshBar(); return; }
    X.finished = true; renderExam(); window.scrollTo(0, 0);
  }
  else if (act === 'retry') start(X.ex.id);
  else if (act === 'menu') { if (X.finished || confirm('¿Salir del examen? Se pierden las respuestas.')) { X = null; render(); } }
});
render();
</script>
</body>
</html>
